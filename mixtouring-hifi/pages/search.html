@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap');
/* MixTouring HiFi — colors_and_type.css */
/* Brand prefix: mixtouring */
/* Design system: Warm Modern Minimalist (from travel-app-hifi) applied to MixTouring product */

:root {
  /* === Core Color Tokens === */
  --color-canvas: #F8F9FA;
  --color-surface: #FFFFFF;
  --color-primary-dark: #111111;
  --color-brand-accent: #C86A4B;
  --color-text-main: #1E2022;
  --color-text-muted: #7C8089;
  --color-badge-rating: #FBBF24;
  --color-accent-heart: #E11D48;
  --color-surface-2: #F4F5F7;
  --color-border-soft: #E8E9EB;

  /* === Semantic Aliases === */
  --mixtouring-background: #F8F9FA;
  --mixtouring-foreground: #1E2022;
  --mixtouring-card: #FFFFFF;
  --mixtouring-card-foreground: #1E2022;
  --mixtouring-popover: #FFFFFF;
  --mixtouring-popover-foreground: #1E2022;
  --mixtouring-primary: #111111;
  --mixtouring-primary-foreground: #FFFFFF;
  --mixtouring-muted: #F4F5F7;
  --mixtouring-muted-foreground: #7C8089;
  --mixtouring-border: #E8E9EB;
  --mixtouring-input: #FFFFFF;
  --mixtouring-ring: #C86A4B;

  /* === Radius Scale === */
  --mixtouring-radius-sm: 8px;
  --mixtouring-radius-md: 16px;
  --mixtouring-radius-lg: 24px;

  /* === Typography === */
  --mixtouring-font-sans: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;

  /* === Shadows === */
  --shadow-dock: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
  --shadow-card-soft: 0 4px 20px -2px rgba(0, 0, 0, 0.04);

  /* === Spacing (8pt grid) === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;

  /* === Radii === */
  --r-sheet: 32px;
  --r-card: 24px;
  --r-pill: 9999px;

  /* === State colors === */
  --state-warning: #FBBF24;
  --state-error: #E11D48;
  --state-success: #34c759;
}

  @theme inline {
    --color-background: var(--mixtouring-background);
    --color-foreground: var(--mixtouring-foreground);
    --color-card: var(--mixtouring-card);
    --color-card-foreground: var(--mixtouring-card-foreground);
    --color-popover: var(--mixtouring-popover);
    --color-popover-foreground: var(--mixtouring-popover-foreground);
    --color-primary: var(--mixtouring-primary);
    --color-primary-foreground: var(--mixtouring-primary-foreground);
    --color-muted: var(--mixtouring-muted);
    --color-muted-foreground: var(--mixtouring-muted-foreground);
    --color-border: var(--mixtouring-border);
    --color-input: var(--mixtouring-input);
    --color-ring: var(--mixtouring-ring);
    --radius-sm: var(--mixtouring-radius-sm);
    --radius-md: var(--mixtouring-radius-md);
    --radius-lg: var(--mixtouring-radius-lg);

  @layer base {
    body { background: var(--mixtouring-background); color: var(--mixtouring-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

  <style id="critical-layout">
    * { font-weight: 400 !important; }
    b, strong { font-weight: 400 !important; }
    html, body { background: var(--mixtouring-background, #F8F9FA); }
    body { overflow-x: hidden; }
    .app-shell {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding: 0 0 112px 0;
      background: var(--mixtouring-background, #F8F9FA);
    }
    .search-input {
      width: 100%;
      border: none;
      border-radius: var(--r-pill, 9999px);
      padding: 11px 16px;
      text-align: center;
      font-size: 16px;
      background: var(--mixtouring-input, #FFFFFF);
      color: var(--mixtouring-foreground, #1E2022);
      outline: none;
      font-family: inherit;
      box-shadow: 0 2px 12px -2px rgba(0, 0, 0, 0.06);
      transition: box-shadow 0.2s ease;
      cursor: pointer;
    }
    .search-input:focus {
      box-shadow: 0 2px 16px -2px rgba(200, 106, 75, 0.18);
    }
    .date-display {
      width: 100%;
      border: none;
      border-radius: var(--r-pill, 9999px);
      padding: 11px 16px;
      text-align: center;
      font-size: 16px;
      background: var(--mixtouring-input, #FFFFFF);
      color: var(--mixtouring-foreground, #1E2022);
      outline: none;
      font-family: inherit;
      box-shadow: 0 2px 12px -2px rgba(0, 0, 0, 0.06);
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: box-shadow 0.2s ease;
    }
    .date-display:hover {
      box-shadow: 0 2px 16px -2px rgba(200, 106, 75, 0.15);
    }

    /* === Bottom Sheet（日历 / 城市选择共用） === */
    .cal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      animation: calFadeIn 0.2s ease;
    }
    .cal-overlay.active { display: flex; }
    @keyframes calFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes calSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .cal-panel {
      width: 100%;
      max-width: 430px;
      background: var(--mixtouring-card, #FFFFFF);
      border-radius: 28px 28px 0 0;
      padding: 20px 20px 32px;
      box-shadow: 0 -8px 40px -4px rgba(0, 0, 0, 0.12);
      animation: calSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cal-handle {
      width: 36px;
      height: 4px;
      border-radius: 9999px;
      background: var(--mixtouring-border, #E8E9EB);
      margin: 0 auto 16px;
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .cal-title {
      font-size: 17px;
      color: var(--mixtouring-foreground, #1E2022);
      letter-spacing: -0.01em;
    }
    .cal-title span { color: var(--mixtouring-ring, #C86A4B); }
    .cal-nav { display: flex; gap: 4px; }
    .cal-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      border: none;
      background: var(--mixtouring-muted, #F4F5F7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .cal-nav-btn:active { background: var(--mixtouring-border, #E8E9EB); }
    .cal-nav-btn svg { width: 16px; height: 16px; color: var(--mixtouring-foreground, #1E2022); }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 8px;
    }
    .cal-weekday {
      text-align: center;
      font-size: 12px;
      color: var(--mixtouring-muted-foreground, #7C8089);
      padding: 6px 0;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--mixtouring-foreground, #1E2022);
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
      border: none;
      background: transparent;
      font-family: inherit;
    }
    .cal-cell:active { background: var(--mixtouring-muted, #F4F5F7); }
    .cal-cell.out-month { color: var(--mixtouring-border, #C8C9CB); }
    .cal-cell.today {
      color: var(--mixtouring-ring, #C86A4B);
    }
    .cal-cell.selected {
      background: var(--mixtouring-primary, #111111);
      color: var(--mixtouring-primary-foreground, #FFFFFF);
    }
    .cal-cell.selected:active {
      background: var(--mixtouring-primary, #111111);
    }

    .cal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 0.5px solid var(--mixtouring-border, #E8E9EB);
    }
    .cal-action-btn {
      border: none;
      background: transparent;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 9999px;
      transition: background 0.15s ease;
    }
    .cal-action-btn:active { background: var(--mixtouring-muted, #F4F5F7); }
    .cal-clear { color: var(--mixtouring-muted-foreground, #7C8089); }
    .cal-today { color: var(--mixtouring-ring, #C86A4B); }

    /* === 城市选择网格 === */
    .city-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 46vh;
      overflow-y: auto;
    }
    .city-cell {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--mixtouring-foreground, #1E2022);
      border-radius: 9999px;
      cursor: pointer;
      border: none;
      background: var(--mixtouring-muted, #F4F5F7);
      font-family: inherit;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .city-cell:active { background: var(--mixtouring-border, #E8E9EB); }
    .city-cell.selected {
      background: var(--mixtouring-primary, #111111);
      color: var(--mixtouring-primary-foreground, #FFFFFF);
    }

    .desc-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hot-card { transition: transform 0.15s ease; cursor: pointer; }
    .hot-card:active { transform: scale(0.98); }
    .cta-btn { transition: transform 0.15s ease; }
    .cta-btn:active { transform: scale(0.98); }
    .route-img-wrap {
      position: relative;
      width: 100%;
      height: 160px;
      overflow: hidden;
      border-radius: 16px 16px 0 0;
    }
    .route-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .route-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border-radius: 9999px;
      padding: 4px 10px;
      font-size: 12px;
      color: #1E2022;
    }
    .route-heart {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
    }
    @media (max-width: 430px) {
      .app-shell { width: 100%; }
    }
  </style>

      </svg>
      <span class="text-[20px]" style="letter-spacing: -0.02em; color: var(--mixtouring-foreground, #1E2022);">

      </span>
    </header>

    <!-- Section 2: Trip Search Card -->
    <section class="mx-4 mt-4 px-4 pt-5 pb-[18px]" style="background: var(--mixtouring-card, #FFFFFF); border-radius: var(--r-card, 24px); box-shadow: var(--shadow-card-soft, 0 4px 20px -2px rgba(0,0,0,0.04));">
      <!-- Origin-Destination labels row -->
      <div class="flex items-center gap-2.5 mb-1.5">
        <span class="flex-1 text-center text-[13px]" style="color: var(--mixtouring-muted-foreground, #7C8089);">出发地</span>
        <span class="w-9 shrink-0"></span>
        <span class="flex-1 text-center text-[13px]" style="color: var(--mixtouring-muted-foreground, #7C8089);">目的地</span>
      </div>
      <!-- Origin-Destination inputs row -->
      <div class="flex items-center gap-2.5">
        <input class="search-input" id="fromInput" value="北京" readonly aria-label="出发地" />
        <button id="btnSwap" class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center" style="background: var(--mixtouring-card, #FFFFFF); box-shadow: 0 2px 12px -2px rgba(0,0,0,0.06); border: none; cursor: pointer;" aria-label="交换出发地和目的地">
          <svg class="w-4 h-4" style="color: var(--mixtouring-ring, #C86A4B);"><use href="#hero-arrows-right-left"></use></svg>
        </button>
        <input class="search-input" id="toInput" value="喀什" readonly aria-label="目的地" />
      </div>
      <!-- Date field -->
      <div class="mt-4">
        <div class="text-center text-[13px] mb-1.5" style="color: var(--mixtouring-muted-foreground, #7C8089);">出发日期</div>
        <div class="relative">
          <div class="date-display" role="button" tabindex="0" aria-label="出发日期">2026/10/01</div>
          <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none" style="color: var(--mixtouring-muted-foreground, #7C8089);"><use href="#hero-calendar"></use></svg>
        </div>
      </div>
      <!-- Natural-language line -->
      <div class="mt-4">
        <div class="text-center text-[13px] mb-1.5" style="color: var(--mixtouring-muted-foreground, #7C8089);">或 用一句话说行程</div>
        <div class="relative">
          <input class="search-input" id="nlInput" placeholder="例如：国庆从杭州去喀什" autocomplete="off" style="text-align:left;" />
          <button id="btnParse" aria-label="解析这句话并为上方表单回填" class="absolute right-1.5 top-1/2 -translate-y-1/2 shrink-0 w-9 h-9 rounded-full flex items-center justify-center" style="background: var(--mixtouring-primary, #111111); color: var(--mixtouring-primary-foreground, #FFFFFF); border: none; cursor: pointer;">
            <svg class="w-4 h-4" style="color: var(--mixtouring-ring, #C86A4B);"><use href="#hero-sparkles"></use></svg>
          </button>
        </div>
      </div>
      <!-- CTA button -->
      <button id="btnGo" class="cta-btn w-full mt-5 rounded-full flex items-center justify-center gap-1.5" style="background: var(--mixtouring-primary, #111111); color: var(--mixtouring-primary-foreground, #FFFFFF); font-size: 16px; padding: 11px 16px; border: none; cursor: pointer; font-family: inherit;">
        <svg class="w-4 h-4" style="color: var(--mixtouring-ring, #C86A4B);"><use href="#hero-sparkles"></use></svg>
        <span>出发!</span>
      </button>
    </section>

    <!-- 问问 AI 入口（Phase 2 触点③：grounded 问答，只基于方案库数据） -->
    <div class="flex justify-center" style="margin-top: 12px;">
      <button id="btnAsk" class="flex items-center gap-1.5 rounded-full" style="background: transparent; border: none; padding: 6px 14px; cursor: pointer; font-family: inherit; color: var(--mixtouring-muted-foreground, #7C8089); font-size: 13px;">
        <svg class="w-3.5 h-3.5" style="color: var(--mixtouring-ring, #C86A4B);"><use href="#hero-sparkles"></use></svg>
        <span>不确定怎么选？问问 AI</span>
      </button>
    </div>

    <!-- Section 3: Section Title -->
    <h2 class="mx-4 text-[13px]" style="color: var(--mixtouring-muted-foreground, #7C8089); letter-spacing: 0.08em; margin-top: 22px; margin-bottom: 4px;">热门远途</h2>

    <!-- Section 4: Hot Route Cards（数据驱动） -->
    <section class="flex flex-col gap-3 px-4" id="hotList"></section>
  </main>

  <!-- Section 5: Bottom Navigation -->
  <nav data-mobile-nav="global" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-md h-[52px] rounded-full bg-white z-50" style="box-shadow: var(--shadow-dock);">
    <div class="flex items-center justify-between w-full h-full px-1">
      <button data-nav-key="search" data-active="true" data-dom-id="nav-search" class="flex flex-col justify-center gap-0.5 w-[52px] h-[52px] items-center rounded-full shrink-0" style="background: var(--mixtouring-primary); color: var(--mixtouring-primary-foreground);">
        <svg class="w-[18px] h-[18px] shrink-0"><use href="#hero-magnifying-glass"></use></svg>
        <span class="text-[10px] leading-none whitespace-nowrap">搜索</span>
      </button>
      <button data-nav-key="library" data-dom-id="nav-library" class="flex flex-col justify-center gap-0.5 px-4 h-full items-center shrink-0" style="color: var(--mixtouring-muted-foreground);">
        <svg class="w-[18px] h-[18px] shrink-0"><use href="#hero-map-pin"></use></svg>
        <span class="text-[10px] leading-none whitespace-nowrap">路线库</span>
      </button>
      <button data-nav-key="me" data-dom-id="nav-me" class="flex flex-col justify-center gap-0.5 px-4 h-full items-center shrink-0" style="color: var(--mixtouring-muted-foreground);">
        <svg class="w-[18px] h-[18px] shrink-0"><use href="#hero-user"></use></svg>
        <span class="text-[10px] leading-none whitespace-nowrap">我的</span>
      </button>
    </div>
  </nav>

  <!-- Custom Calendar Popup -->
  <div class="cal-overlay" id="calOverlay">
    <div class="cal-panel">
      <div class="cal-handle"></div>
      <div class="cal-header">
        <div class="cal-title" id="calMonthLabel">2026年 <span>10月</span></div>
        <div class="cal-nav">
          <button class="cal-nav-btn" id="calPrev" aria-label="上个月"><svg class="w-4 h-4" style="color: var(--mixtouring-foreground, #1E2022);"><use href="#hero-chevron-left"></use></svg></button>
          <button class="cal-nav-btn" id="calNext" aria-label="下个月"><svg class="w-4 h-4" style="color: var(--mixtouring-foreground, #1E2022);"><use href="#hero-chevron-right"></use></svg></button>
        </div>
      </div>
      <div class="cal-weekdays">
        <div class="cal-weekday">一</div><div class="cal-weekday">二</div><div class="cal-weekday">三</div><div class="cal-weekday">四</div><div class="cal-weekday">五</div><div class="cal-weekday">六</div><div class="cal-weekday">日</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-actions">
        <button class="cal-action-btn cal-clear" id="calClear">清除</button>
        <button class="cal-action-btn cal-today" id="calToday">今天</button>
      </div>
    </div>
  </div>

  <!-- City Picker Sheet -->
  <div class="cal-overlay" id="cityOverlay">
    <div class="cal-panel">
      <div class="cal-handle"></div>
      <div class="cal-header">
        <div class="cal-title" id="cityTitle">选择<span>出发地</span></div>
        <button class="cal-nav-btn" id="cityClose" aria-label="关闭"><svg class="w-4 h-4" style="color: var(--mixtouring-foreground, #1E2022);"><use href="#hero-x-mark"></use></svg></button>
      </div>
      <div class="city-grid no-scrollbar" id="cityGrid"></div>
    </div>
  </div>

  <!-- 问问 AI 底册（Phase 2 触点③：grounded 问答） -->
  <div class="cal-overlay" id="qaOverlay">
    <div class="cal-panel" style="padding-bottom: 24px;">
      <div class="cal-handle"></div>
      <div class="cal-header">
        <div class="cal-title">问问 <span>AI</span></div>
        <button class="cal-nav-btn" id="qaClose" aria-label="关闭"><svg class="w-4 h-4" style="color: var(--mixtouring-foreground, #1E2022);"><use href="#hero-x-mark"></use></svg></button>
      </div>
      <div id="qaAnswer" class="text-[13.5px]" style="color: var(--mixtouring-foreground, #1E2022); line-height: 1.7; white-space: pre-line; min-height: 72px; max-height: 40vh; overflow-y: auto;">答案只基于方案库真实数据：问库里有哪条线、哪个最省、衔接要注意什么。例：「北京去喀什哪个方案最省？」</div>
      <div id="qaFollowUp" style="display:none;margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(200,106,75,0.08);font-size:12.5px;color:#A8543A;line-height:1.6;"></div>
      <div id="qaRefs" class="flex flex-wrap gap-2" style="margin-top: 10px;"></div>
      <div class="flex items-center gap-2" style="margin-top: 14px;">
        <input id="qaInput" class="flex-1 min-w-0" type="text" placeholder="例如：北京去喀什哪个方案最省" aria-label="问问 AI"
               style="border: 0.5px solid var(--mixtouring-border, #E8E9EB); outline: none; background: var(--mixtouring-input, #FFFFFF); border-radius: var(--r-pill, 9999px); padding: 10px 16px; font-size: 14px; font-family: inherit; color: var(--mixtouring-foreground, #1E2022);" />
        <button id="qaGo" class="shrink-0 rounded-full" style="background: var(--mixtouring-primary, #111111); color: var(--mixtouring-primary-foreground, #FFFFFF); border: none; padding: 10px 16px; font-size: 13px; font-family: inherit; cursor: pointer;">提问</button>
      </div>
    </div>
  </div>

  <script src="../assets/mock.js"></script>
  <script src="../assets/api.js"></script>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var fromInput = document.getElementById('fromInput');
    var toInput = document.getElementById('toInput');
    var dateDisplay = document.querySelector('.date-display');

    /* URL 预填（模板「一键复用」入口：只复用起终点，日期由用户重选） */
    var preFrom = MT.qs('from');
    var preTo = MT.qs('to');
    if (preFrom) fromInput.value = preFrom;
    if (preTo) toInput.value = preTo;

    MT.wireNav();

    /* ---------- 交换起终点 ---------- */
    document.getElementById('btnSwap').addEventListener('click', function () {
      var a = fromInput.value;
      fromInput.value = toInput.value;
      toInput.value = a;
    });

    /* ---------- CTA：去生成方案 ---------- */
    document.getElementById('btnGo').addEventListener('click', function () {
      var from = fromInput.value.trim();
      var to = toInput.value.trim();
      var date = dateDisplay.textContent.trim();
      if (!from || !to) { MT.toast('先选好出发地和目的地'); return; }
      if (from === to) { MT.toast('出发地和目的地不能相同'); return; }
      if (!/^\d{4}\/\d{2}\/\d{2}$/.test(date)) { MT.toast('先选一个出发日期'); return; }
      var q = new URLSearchParams({ from: from, to: to, date: date });
      location.href = 'loading.html?' + q.toString();
    });

    /* ---------- 自然语言解析：一句话回填起终点/日期（Phase 2 · 触点①） ---------- */
    var nlInput = document.getElementById('nlInput');
    var btnParse = document.getElementById('btnParse');

    function doParse() {
      var q = (nlInput.value || '').trim();
      if (!q) { MT.toast('先输入一句话，例如「国庆从杭州去喀什」'); return; }
      API.parseNaturalLanguage(q).then(function (res) {
        var d = res && res.data;
        if (!d) { MT.toast('暂时没听懂，换个说法试试'); return; }
        var fields = 0;
        if (d.from) { fromInput.value = d.from; fields++; }
        if (d.to) { toInput.value = d.to; fields++; }
        if (d.date) { dateDisplay.textContent = d.date; fields++; }
        if (d.note) MT.toast(d.note);
        else MT.toast('已回填，核对无误可点出发');
        if (fields === 0) MT.toast('没识别到城市/日期，请手动选择');
      }).catch(function () { MT.toast('解析失败，请稍后再试'); });
    }

    btnParse.addEventListener('click', doParse);
    nlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); doParse(); } });

    /* ---------- 问问 AI 底册（Phase 2 · 触点③：grounded 问答，refs 跳方案详情） ---------- */
    var qaOverlay = document.getElementById('qaOverlay');
    var qaInput = document.getElementById('qaInput');
    var qaGo = document.getElementById('qaGo');
    var qaAnswer = document.getElementById('qaAnswer');
    var qaRefs = document.getElementById('qaRefs');
    var qaProgress = null; /* 当前采集进度轮询句柄（v0.17） */

    document.getElementById('btnAsk').addEventListener('click', function () { qaOverlay.classList.add('active'); });
    document.getElementById('qaClose').addEventListener('click', function () { qaOverlay.classList.remove('active'); });
    qaOverlay.addEventListener('click', function (e) { if (e.target === qaOverlay) qaOverlay.classList.remove('active'); });

    function doAsk() {
      var q = (qaInput.value || '').trim();
      if (!q) { MT.toast('先输入你的问题'); return; }
      qaGo.disabled = true; qaGo.style.opacity = '0.5'; qaGo.textContent = '…';
      qaAnswer.textContent = '思考中…'; qaRefs.innerHTML = '';
      API.askQ(q).then(function (res) {
        if (!res || res.code !== 0 || !res.data) {
          qaAnswer.textContent = (res && res.msg) || '问答服务暂时不可用';
          return;
        }
        qaAnswer.textContent = res.data.answer || '没答上来，换个问法试试';
        /* 缺数据路线自动衔接生成环节：实时进度条 + 完成弹窗（v0.17 两步流升级） */
        var fu = res.data.followUp;
        var fuLine = document.getElementById('qaFollowUp');
        if (qaProgress) { qaProgress.stop(); qaProgress = null; }
        if (fu && fu.wishRegistered) {
          fuLine.style.display = 'block';
          if (fu.collecting) {
            fuLine.innerHTML = '<div>✦ 已自动登记 ' + MT.esc(fu.from) + ' → ' + MT.esc(fu.to) + '，AI 正在联网采集真实班次与票价</div>' +
              '<div data-fu-mount style="margin-top:8px;"></div>';
            qaProgress = MT.wishProgress({
              from: fu.from, to: fu.to, mount: fuLine.querySelector('[data-fu-mount]'),
              onDone: function () {
                fuLine.innerHTML = '<div>✦ ' + MT.esc(fu.from) + ' → ' + MT.esc(fu.to) + ' 方案已生成</div>';
                MT.modal({
                  title: '省钱方案已生成 ✦',
                  body: fu.from + ' → ' + fu.to + ' 的联网探索完成，方案已按总花费排好序',
                  actions: [
                    { label: '查看方案', primary: true, onClick: function () { MT.go('loading.html', { from: fu.from, to: fu.to }); } },
                    { label: '留在本页' }
                  ]
                });
              },
              onFail: function (info) {
                fuLine.innerHTML = '<div>✦ ' + MT.esc(fu.from) + ' → ' + MT.esc(fu.to) + '：' +
                  (info && info.reason === 'timeout'
                    ? '采集时间较长，已转入探索队列，完成后「我的」页可见'
                    : '这一轮没能生成出比直飞更省的组合，已如实记录，稍后自动重试') + '</div>';
              }
            });
          } else {
            fuLine.textContent = '✦ 已自动登记 ' + fu.from + ' → ' + fu.to + ' 离线探索' + (fu.note ? '（' + fu.note + '）' : '') + '，可在「我的」页跟踪';
          }
        } else {
          fuLine.style.display = 'none';
        }
        (res.data.refs || []).forEach(function (id) {
          var b = document.createElement('button');
          b.className = 'rounded-full';
          b.style.cssText = 'background: var(--mixtouring-muted, #F4F5F7); border: none; padding: 6px 12px; font-size: 12px; font-family: inherit; cursor: pointer; color: var(--mixtouring-ring, #C86A4B);';
          b.textContent = '查看 ' + id;
          b.addEventListener('click', function () { location.href = 'detail.html?id=' + encodeURIComponent(id); });
          qaRefs.appendChild(b);
        });
      }).catch(function () { qaAnswer.textContent = '问答服务暂时不可用'; })
        .finally(function () { qaGo.disabled = false; qaGo.style.opacity = ''; qaGo.textContent = '提问'; });
    }
    qaGo.addEventListener('click', doAsk);
    qaInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); doAsk(); } });

    /* ---------- 城市选择底册 ---------- */
    var cityOverlay = document.getElementById('cityOverlay');
    var cityGrid = document.getElementById('cityGrid');
    var cityTitle = document.getElementById('cityTitle');
    var picking = null; /* 'from' | 'to' */

    function renderCities() {
      var current = picking === 'from' ? fromInput.value : toInput.value;
      cityGrid.innerHTML = '';
      DB.cities.forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'city-cell' + (c === current ? ' selected' : '');
        b.textContent = c;
        b.addEventListener('click', function () {
          if (picking === 'from') fromInput.value = c; else toInput.value = c;
          closeCity();
        });
        cityGrid.appendChild(b);
      });
    }
    function openCity(which) {
      picking = which;
      cityTitle.innerHTML = '选择<span>' + (which === 'from' ? '出发地' : '目的地') + '</span>';
      renderCities();
      cityOverlay.classList.add('active');
    }
    function closeCity() { cityOverlay.classList.remove('active'); }

    fromInput.addEventListener('click', function () { openCity('from'); });
    toInput.addEventListener('click', function () { openCity('to'); });
    document.getElementById('cityClose').addEventListener('click', closeCity);
    cityOverlay.addEventListener('click', function (e) { if (e.target === cityOverlay) closeCity(); });

    /* ---------- 热门远途（数据驱动：路线库 TOP3 模板） ---------- */
    function hotCardHtml(t) {
      var fav = MT.isFav(t.id);
      return '<article class="hot-card overflow-hidden" data-tpl-id="' + MT.esc(t.id) + '" role="button" tabindex="0" style="background: var(--mixtouring-card, #FFFFFF); border-radius: var(--mixtouring-radius-md, 16px); box-shadow: var(--shadow-card-soft, 0 4px 20px -2px rgba(0,0,0,0.04));">' +
        '<div class="route-img-wrap">' +
          '<img src="' + MT.esc(t.img) + '" alt="' + MT.esc(t.to) + '风光" loading="lazy" />' +
          '<span class="route-badge">' +
            '<svg class="w-3 h-3" style="color: var(--state-warning, #FBBF24);"><use href="#hero-star-solid"></use></svg>' + t.rating +
          '</span>' +
          '<button class="route-heart" data-heart="' + MT.esc(t.id) + '" aria-label="' + (fav ? '取消收藏' : '收藏') + '">' +
            '<svg class="w-4 h-4" style="color: ' + (fav ? 'var(--color-accent-heart, #E11D48)' : 'var(--mixtouring-foreground, #1E2022)') + ';"><use href="' + (fav ? '#hero-heart-solid' : '#hero-heart') + '"></use></svg>' +
          '</button>' +
        '</div>' +
        '<div class="px-4 py-3 flex flex-col gap-1">' +
          '<div class="flex items-center justify-between gap-2">' +
            '<span class="text-[15px]" style="color: var(--mixtouring-foreground, #1E2022);">' + MT.esc(t.from) + ' → ' + MT.esc(t.to) + ' · ' + MT.esc(t.totalTime.replace('总 ', '')) + '</span>' +
            '<span class="text-[12px] shrink-0" style="color: var(--mixtouring-ring, #C86A4B);">' + MT.esc(t.contributor) + '</span>' +
          '</div>' +
          '<p class="text-[12.5px] desc-clamp-2" style="color: var(--mixtouring-muted-foreground, #7C8089); line-height: 1.5;">' + MT.esc(t.desc) + '</p>' +
        '</div>' +
      '</article>';
    }

    var hotList = document.getElementById('hotList');
    hotList.innerHTML = DB.templates.slice(0, 3).map(hotCardHtml).join('');

    hotList.querySelectorAll('.hot-card').forEach(function (card) {
      var tplId = card.getAttribute('data-tpl-id');
      function open() { location.href = 'detail.html?tpl=' + tplId; }
      card.addEventListener('click', open);
      card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });

    hotList.querySelectorAll('[data-heart]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var tplId = btn.getAttribute('data-heart');
        var t = DB.findTemplate(tplId);
        if (!t) return;
        var on = MT.toggleFav(MT.favSnapshot(t));
        btn.setAttribute('aria-label', on ? '取消收藏' : '收藏');
        btn.innerHTML = '<svg class="w-4 h-4" style="color: ' + (on ? 'var(--color-accent-heart, #E11D48)' : 'var(--mixtouring-foreground, #1E2022)') + ';"><use href="' + (on ? '#hero-heart-solid' : '#hero-heart') + '"></use></svg>';
        MT.toast(on ? '已收藏，可在「我的」查看' : '已取消收藏');
      });
    });
  })();
  </script>

  <script>
  (function() {
    var overlay = document.getElementById('calOverlay');
    var dateDisplay = document.querySelector('.date-display');
    var grid = document.getElementById('calGrid');
    var label = document.getElementById('calMonthLabel');
    var btnPrev = document.getElementById('calPrev');
    var btnNext = document.getElementById('calNext');
    var btnClear = document.getElementById('calClear');
    var btnToday = document.getElementById('calToday');

    var viewYear = 2026;
    var viewMonth = 9;
    var selectedDate = new Date(2026, 9, 1);
    var today = new Date();

    var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function fmtDate(d) { return d.getFullYear() + '/' + pad(d.getMonth()+1) + '/' + pad(d.getDate()); }
    function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

    function render() {
      label.innerHTML = viewYear + '年 <span>' + monthNames[viewMonth] + '</span>';
      var first = new Date(viewYear, viewMonth, 1);
      var last = new Date(viewYear, viewMonth + 1, 0);
      var startOffset = (first.getDay() + 6) % 7;
      var totalDays = last.getDate();
      var prevLast = new Date(viewYear, viewMonth, 0).getDate();
      var cells = [];

      for (var i = startOffset - 1; i >= 0; i--) {
        cells.push({ day: prevLast - i, outMonth: true, date: new Date(viewYear, viewMonth - 1, prevLast - i) });
      }
      for (var d = 1; d <= totalDays; d++) {
        cells.push({ day: d, outMonth: false, date: new Date(viewYear, viewMonth, d) });
      }
      var nextStart = 1;
      while (cells.length < 42) {
        cells.push({ day: nextStart, outMonth: true, date: new Date(viewYear, viewMonth + 1, nextStart) });
        nextStart++;
      }

      grid.innerHTML = '';
      cells.forEach(function(c) {
        var btn = document.createElement('button');
        btn.className = 'cal-cell';
        if (c.outMonth) btn.classList.add('out-month');
        if (isSameDay(c.date, today)) btn.classList.add('today');
        if (selectedDate && isSameDay(c.date, selectedDate)) btn.classList.add('selected');
        btn.textContent = c.day;
        btn.addEventListener('click', function() {
          selectedDate = c.date;
          dateDisplay.textContent = fmtDate(c.date);
          overlay.classList.remove('active');
          render();
        });
        grid.appendChild(btn);
      });
    }

    function open() { overlay.classList.add('active'); render(); }
    function close() { overlay.classList.remove('active'); }

    dateDisplay.addEventListener('click', open);
    dateDisplay.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
    btnPrev.addEventListener('click', function() { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render(); });
    btnNext.addEventListener('click', function() { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render(); });
    btnClear.addEventListener('click', function() { selectedDate = null; dateDisplay.textContent = '选择日期'; close(); });
    btnToday.addEventListener('click', function() { selectedDate = new Date(); viewYear = today.getFullYear(); viewMonth = today.getMonth(); dateDisplay.textContent = fmtDate(today); render(); });

    render();
  })();
  </script>
</body>
