<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在规划路线</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap');
/* MixTouring HiFi — colors_and_type.css */
/* Brand prefix: mixtouring */
/* Design system: Warm Modern Minimalist (from travel-app-hifi) applied to MixTouring product */

:root {
  /* === Core Color Tokens === */
  --color-canvas: #F8F9FA;
  --color-surface: #FFFFFF;
  --color-primary-dark: #111111;
  --color-brand-accent: #C86A4B;
  --color-text-main: #1E2022;
  --color-text-muted: #7C8089;
  --color-badge-rating: #FBBF24;
  --color-accent-heart: #E11D48;
  --color-surface-2: #F4F5F7;
  --color-border-soft: #E8E9EB;

  /* === Semantic Aliases === */
  --mixtouring-background: #F8F9FA;
  --mixtouring-foreground: #1E2022;
  --mixtouring-card: #FFFFFF;
  --mixtouring-card-foreground: #1E2022;
  --mixtouring-popover: #FFFFFF;
  --mixtouring-popover-foreground: #1E2022;
  --mixtouring-primary: #111111;
  --mixtouring-primary-foreground: #FFFFFF;
  --mixtouring-muted: #F4F5F7;
  --mixtouring-muted-foreground: #7C8089;
  --mixtouring-border: #E8E9EB;
  --mixtouring-input: #FFFFFF;
  --mixtouring-ring: #C86A4B;

  /* === Radius Scale === */
  --mixtouring-radius-sm: 8px;
  --mixtouring-radius-md: 16px;
  --mixtouring-radius-lg: 24px;

  /* === Typography === */
  --mixtouring-font-sans: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;

  /* === Shadows === */
  --shadow-dock: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
  --shadow-card-soft: 0 4px 20px -2px rgba(0, 0, 0, 0.04);

  /* === Spacing (8pt grid) === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;

  /* === Radii === */
  --r-sheet: 32px;
  --r-card: 24px;
  --r-pill: 9999px;

  /* === State colors === */
  --state-warning: #FBBF24;
  --state-error: #E11D48;
  --state-success: #34c759;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--mixtouring-background);
    --color-foreground: var(--mixtouring-foreground);
    --color-card: var(--mixtouring-card);
    --color-card-foreground: var(--mixtouring-card-foreground);
    --color-popover: var(--mixtouring-popover);
    --color-popover-foreground: var(--mixtouring-popover-foreground);
    --color-primary: var(--mixtouring-primary);
    --color-primary-foreground: var(--mixtouring-primary-foreground);
    --color-muted: var(--mixtouring-muted);
    --color-muted-foreground: var(--mixtouring-muted-foreground);
    --color-border: var(--mixtouring-border);
    --color-input: var(--mixtouring-input);
    --color-ring: var(--mixtouring-ring);
    --radius-sm: var(--mixtouring-radius-sm);
    --radius-md: var(--mixtouring-radius-md);
    --radius-lg: var(--mixtouring-radius-lg);
  }
  @layer base {
    body { background: var(--mixtouring-background); color: var(--mixtouring-foreground); }
  }

      .bg-background { background-color: var(--mixtouring-background); }

      .bg-muted { background-color: var(--mixtouring-muted); }
      .text-foreground { color: var(--mixtouring-foreground); }
      .text-primary-foreground { color: var(--mixtouring-primary-foreground); }
      .text-muted-foreground { color: var(--mixtouring-muted-foreground); }

      .no-scrollbar::-webkit-scrollbar { display: none; }

</head>

  <style id="critical-layout">
    * { font-weight: 400 !important; }
    b, strong { font-weight: 400 !important; }
    html, body { background: var(--mixtouring-background, #F8F9FA); }
    body { overflow-x: hidden; }
    .app-shell {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding: 0 0 112px 0;
      background: var(--mixtouring-background, #F8F9FA);
      display: flex;
      flex-direction: column;
    }
    @keyframes ringPulse {
      0% { transform: scale(1); opacity: 0.5; }
      70% { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes sparkFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 1.5px solid var(--mixtouring-ring, #C86A4B);
      animation: ringPulse 1.8s ease-out infinite;
    }
    .spark-wrap { animation: sparkFloat 2.4s ease-in-out infinite; }
    .progress-track {
      width: 200px;
      height: 4px;
      border-radius: 9999px;
      background: var(--mixtouring-border, #E8E9EB);
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 9999px;
      background: var(--mixtouring-ring, #C86A4B);
      transition: width 0.5s ease;
    }
    .step-row { display: flex; align-items: center; gap: 10px; transition: opacity 0.3s ease; opacity: 0.32; }
    .step-row.active { opacity: 1; }
    .step-dot {
      width: 6px; height: 6px; border-radius: 9999px;
      background: var(--mixtouring-muted-foreground, #7C8089);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }
    .step-row.active .step-dot { background: var(--mixtouring-ring, #C86A4B); }
    @media (prefers-reduced-motion: reduce) {
      .pulse-ring, .spark-wrap { animation: none; }
      .progress-bar { transition: none; }
    }
    @media (max-width: 430px) {
      .app-shell { width: 100%; }
    }
  </style>

  <main class="app-shell">
    <!-- Top bar: cancel -->
    <div class="flex items-center px-4" style="height: 52px;">
      <button id="btnCancel" class="flex items-center" style="color: var(--mixtouring-ring, #C86A4B); font-size: 15px; background: none; border: none; cursor: pointer; font-family: inherit; padding: 8px 0;">
        <span style="font-size: 22px; line-height: 1;">&#8249;</span>
        <span class="ml-0.5">取消</span>
      </button>
    </div>

    <!-- Center: brand + animation -->
    <div class="flex-1 flex flex-col items-center justify-center px-8" style="gap: 22px; padding-bottom: 40px;">
      <div class="relative flex items-center justify-center" style="width: 76px; height: 76px;">
        <div class="pulse-ring"></div>
        <div class="flex items-center justify-center" style="width: 64px; height: 64px; border-radius: 9999px; background: var(--mixtouring-card, #FFFFFF); box-shadow: var(--shadow-card-soft, 0 4px 20px -2px rgba(0,0,0,0.04));">
          <div class="spark-wrap">
            <svg style="width: 26px; height: 26px; color: var(--mixtouring-ring, #C86A4B);"><use href="#hero-sparkles"></use></svg>
          </div>
        </div>
      </div>

      <div class="text-center">
        <div id="genHeadline" style="font-size: 19px; color: var(--mixtouring-foreground, #1E2022); letter-spacing: -0.01em;">AI 正在规划路线</div>
        <div id="routeLabel" style="font-size: 13.5px; color: var(--mixtouring-muted-foreground, #7C8089); margin-top: 6px;">北京 → 喀什 · 10月1日</div>
      </div>

      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>

      <div class="flex flex-col" style="gap: 10px; margin-top: 2px;" id="stepList"></div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav data-mobile-nav="global" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-md h-[52px] rounded-full bg-white z-50" style="box-shadow: var(--shadow-dock);">
    <div class="flex items-center justify-between w-full h-full px-1">
      <button data-nav-key="search" data-active="true" data-dom-id="nav-search" class="flex flex-col justify-center gap-0.5 w-[52px] h-[52px] items-center rounded-full shrink-0" style="background: var(--mixtouring-primary); color: var(--mixtouring-primary-foreground);">
        <svg class="w-[18px] h-[18px] shrink-0"><use href="#hero-magnifying-glass"></use></svg>
        <span class="text-[10px] leading-none whitespace-nowrap">搜索</span>
      </button>
      <button data-nav-key="library" data-dom-id="nav-library" class="flex flex-col justify-center gap-0.5 px-4 h-full items-center shrink-0" style="color: var(--mixtouring-muted-foreground);">
        <svg class="w-[18px] h-[18px] shrink-0"><use href="#hero-map-pin"></use></svg>
        <span class="text-[10px] leading-none whitespace-nowrap">路线库</span>
      </button>
      <button data-nav-key="me" data-dom-id="nav-me" class="flex flex-col justify-center gap-0.5 px-4 h-full items-center shrink-0" style="color: var(--mixtouring-muted-foreground);">
        <svg class="w-[18px] h-[18px] shrink-0"><use href="#hero-user"></use></svg>
        <span class="text-[10px] leading-none whitespace-nowrap">我的</span>
      </button>
    </div>
  </nav>

  <script src="../assets/mock.js"></script>
  <script src="../assets/api.js"></script>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var from = MT.qs('from') || '北京';
    var to = MT.qs('to') || '喀什';
    var date = MT.qs('date') || '2026/10/01';

    var dm = date.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
    var dateLabel = dm ? (parseInt(dm[2], 10) + '月' + parseInt(dm[3], 10) + '日') : date;
    document.getElementById('routeLabel').textContent = from + ' → ' + to + ' · ' + dateLabel;

    document.getElementById('btnCancel').addEventListener('click', function () {
      MT.goBack('search.html');
    });

    MT.wireNav();

    /* 生成仪式三分支（v0.14.0）：杜绝「伪装实时规划」——
       有数据 → 完整仪式（步骤接方案库真实事实）；
       已登记离线探索 → 短过渡如实说明队列状态，不假装在规划；
       无数据未登记 → 极简过渡如实告知无样本，下一页引导登记 */
    var route = window.DB.routes[from + '-' + to];
    var steps, headline, stepMs, holdMs;
    var wishIdx = MT.wishIndex(from, to);
    var wish = wishIdx !== -1 ? MT.wishList()[wishIdx] : null;
    var isPending = wish && (wish.status === 'pending' || wish.status === 'processing');

    if (route && route.plans.length) {
      var seen = {};
      var cities = [];
      route.plans.forEach(function (p) {
        p.stops.slice(1, -1).forEach(function (s) {
          if (!seen[s.name]) { seen[s.name] = 1; cities.push(s.name); }
        });
      });
      var cityText = cities.length > 3
        ? cities.slice(0, 2).join(' / ') + ' 等 ' + cities.length + ' 城'
        : cities.join(' / ');
      steps = [
        '检索 ' + from + ' 出发的班次与票价样本',
        '在 ' + cityText + ' 匹配中转组合',
        '评估 ' + route.plans.length + ' 个候选的四因子衔接风险',
        '对比直飞基准 ' + route.direct.price + '，按总花费排序'
      ];
      headline = '已找到 ' + route.plans.length + ' 个省钱方案';
      stepMs = 560; holdMs = 2950;
    } else if (isPending) {
      steps = [
        '已在探索队列' + (wish.ts ? ' · 登记于 ' + MT.fmtTs(wish.ts) : ''),
        'AI 联网采集真实班次与票价，通常 1–2 分钟',
        '完成后搜索页问答入口与「我的」页可见进度'
      ];
      headline = '探索中 · 无需等待';
      stepMs = 380; holdMs = 1700;
    } else {
      steps = [
        '方案库暂无这条线的真实样本',
        '不做编造——下一页自动开始 AI 联网探索（约 1–2 分钟）'
      ];
      headline = '这条线暂无样本 · 即刻 AI 探索';
      stepMs = 360; holdMs = 1400;
    }

    var stepList = document.getElementById('stepList');
    stepList.innerHTML = steps.map(function (t, i) {
      return '<div class="step-row' + (i === 0 ? ' active' : '') + '"><span class="step-dot"></span>' +
        '<span style="font-size: 13px; color: var(--mixtouring-muted-foreground, #7C8089);">' + MT.esc(t) + '</span></div>';
    }).join('');

    /* 步骤动画 + 进度条；完成态换标题节拍，随后 location.replace 跳结果页——
       生成中是瞬态过渡页，不能留在返回栈里（v0.3.5 教训） */
    var rows = stepList.querySelectorAll('.step-row');
    var bar = document.getElementById('progressBar');
    var step = 0;
    bar.style.width = '18%';
    var timer = setInterval(function () {
      step++;
      if (step < rows.length) {
        rows[step].classList.add('active');
        bar.style.width = (18 + step * Math.round(78 / rows.length)) + '%';
      }
    }, stepMs);

    setTimeout(function () {
      clearInterval(timer);
      bar.style.width = '100%';
      document.getElementById('genHeadline').textContent = headline;
    }, holdMs - 650);

    setTimeout(function () {
      var q = new URLSearchParams({ from: from, to: to, date: date });
      location.replace('results.html?' + q.toString());
    }, holdMs);

    /* 服务端队列补偿：本地无登记但服务端队列有（跨浏览器/运营录入），响应及时就原位升级为探索中文案 */
    if (!route && !isPending && window.API) {
      API.fetchWishes().then(function (res) {
        if (!res || res.code !== 0 || !Array.isArray(res.data)) return;
        var hit = res.data.find(function (w) {
          return w.from === from && w.to === to && (w.status === 'pending' || w.status === 'processing');
        });
        if (!hit) return;
        headline = '探索中 · 无需等待';
        steps = [
          '已在探索队列（服务端登记）',
          'AI 联网采集真实班次与票价，通常 1–2 分钟',
          '完成后搜索页问答入口与「我的」页可见进度'
        ];
        stepList.innerHTML = steps.map(function (t) {
          return '<div class="step-row active"><span class="step-dot"></span>' +
            '<span style="font-size: 13px; color: var(--mixtouring-muted-foreground, #7C8089);">' + MT.esc(t) + '</span></div>';
        }).join('');
        document.getElementById('genHeadline').textContent = headline;
      });
    }
  })();
  </script>
