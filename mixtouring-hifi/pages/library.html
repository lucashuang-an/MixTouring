<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="stylesheet" href="../assets/desktop.css" />
  <link rel="stylesheet" href="../assets/route-cards.css">
</head>
<body class="trip-page library-page">

      <symbol id="hero-map-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/></symbol>
      <symbol id="hero-user" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></symbol>

  </svg>
  <main class="app-shell">
    <p class="mt-route-label">从一个没想到的走法开始</p>
    <h1>路线灵感</h1>
    <p class="mt-route-muted">先看看途经哪里、有什么取舍。找到感兴趣的方向，再一起规划你的旅程。</p>
    <div class="library-filters" aria-label="路线分类">
      <button type="button" data-scope="all" aria-pressed="true">全部</button>
      <button type="button" data-scope="international" aria-pressed="false">国际探索</button>
      <button type="button" data-scope="domestic" aria-pressed="false">国内灵感</button>
    </div>
    <p id="libraryStatus" class="mt-route-muted" role="status"></p>
    <button id="libraryRetry" type="button" hidden>重新加载</button>
    <div id="tplList"></div>
    <p class="mt-route-muted">私人草案保存在<a href="me.html">我的行程</a>，不会自动公开到路线库。</p>
  </main>
  <nav data-mobile-nav="global" aria-label="主要导航" class="trip-nav">
    <div>
      <a href="trip.html"><svg aria-hidden="true"><use href="#hero-magnifying-glass"></use></svg><span>规划</span></a>
      <a href="library.html" aria-current="page" class="trip-nav-current"><svg aria-hidden="true"><use href="#hero-map-pin"></use></svg><span>路线库</span></a>
      <a href="me.html"><svg aria-hidden="true"><use href="#hero-user"></use></svg><span>我的</span></a>
    </div>
  </nav>
  <script src="../assets/app.js"></script>
  <script src="../assets/library.js"></script>
</body>
</html>
