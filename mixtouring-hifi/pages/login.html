<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · MixTouring</title><script src="../assets/theme.js"></script><script src="../assets/language.js"></script><link rel="stylesheet" href="../assets/desktop-ui.css"><link rel="stylesheet" href="../assets/auth.css"><script src="../assets/auth.js" defer></script></head>
<body class="auth-page"><a class="mt-skip" href="#mainContent">跳转到登录表单</a><nav aria-label="MixTouring"><a class="brand" href="/">MixTouring</a><select id="authLanguage" aria-label="显示语言"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="system">跟随浏览器语言</option></select></nav><main id="mainContent" tabindex="-1"><h1 id="title">欢迎回来</h1><p id="intro">登录，继续规划下一趟旅行。</p><form id="authForm">
<label for="username">账号</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" aria-describedby="accountHint"><small id="accountHint">3—32位字母、数字或下划线</small>
<label for="password">密码</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"><button id="showPassword" type="button" aria-label="显示密码">显示</button></div>
<div id="registerFields" hidden><label for="confirmPassword">确认密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128"><label for="invite">邀请码</label><input id="invite" name="invite" autocomplete="off" maxlength="256"><small>使用收到的一次性邀请码注册。</small></div>
<p id="error" role="alert"></p><button class="submit" id="submit">登录</button></form><p class="switch"><span id="switchText">还没有账号？</span> <button id="switchMode" type="button">邀请码注册</button></p><p class="note">内测期间，行程保存在当前浏览器，不会自动同步到其他设备。</p></main></body></html>
