<body class="trip-page product-page" style="margin:0;background:var(--mixtouring-background);font-family:var(--mixtouring-font-sans);color:var(--mixtouring-foreground);-webkit-font-smoothing:antialiased;">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none;" aria-hidden="true">
    <defs>
      <symbol id="hero-sparkles" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.456-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z"/></symbol>
      <symbol id="hero-exclamation-triangle" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0zM12 15.75h.008v.008H12v-.008z"/></symbol>
      <symbol id="hero-magnifying-glass" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></symbol>
      <symbol id="hero-map-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/></symbol>

      <symbol id="hero-shield-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.959 11.959 0 0 1 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></symbol>

  <main class="trip-shell">
    <!-- 品牌区 -->
    <div class="workspace-brand" style="text-align:center;padding:6px 0 18px;">
      <span style="font-size:22px;">Mix<span style="color:var(--mixtouring-ring);">Touring</span></span>
      <div style="font-size:13.5px;color:var(--mixtouring-muted-foreground);margin-top:6px;">从一个想法，慢慢变成一趟旅行</div>
    </div>

    <!-- 一句话先行；手动起终点与具体限制在需要时展开。 -->
    <div id="entryCard" class="detail-card" style="background:var(--mixtouring-card);border-radius:20px;padding:22px;box-shadow:var(--shadow-card-soft);">
      <label id="entryLabel" for="nlInput" style="display:block;font-size:14px;margin-bottom:12px;">找到更值得的走法，<br>把时间留给想玩的地方。</label>
      <p class="entry-description">直达、沿途停留，或换一种交通组合。说说你的想法，一起比较体验与代价。</p>
      <form id="conversationComposer" class="conversation-composer">
        <textarea id="nlInput" rows="2" maxlength="2000" placeholder="想去哪、怎么玩，都可以从这里说起" aria-label="旅行想法"></textarea>
        <button id="btnParse" type="submit" aria-label="发送" title="发送" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
      <div class="entry-examples"><span>从这些想法开始</span><button type="button" data-idea="我想从北京去阿拉木图，10天，一个人，预算8000元，喜欢自然和本地文化，愿意坐长途巴士。">北京 → 阿拉木图，沿途多看看 <span aria-hidden="true">↗</span></button><button type="button" data-idea="想去一个适合散步和看自然的地方，不开车，先一起想想去哪。">还没决定去哪，先聊聊 <span aria-hidden="true">↗</span></button></div>
      <div id="entryExtras" hidden>
      <details id="manualEntry" style="margin-top:13px;">
        <summary style="cursor:pointer;font-size:12px;color:var(--mixtouring-muted-foreground);padding:8px 0;">也可以直接填写出发地和目的地</summary>
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
        <div style="flex:1;min-width:150px;">
          <div style="font-size:12px;color:var(--mixtouring-muted-foreground);margin-bottom:6px;">出发地</div>
          <input id="fromInput" type="text" placeholder="出发城市" aria-label="出发地"
                 style="width:100%;box-sizing:border-box;border:0.5px solid var(--mixtouring-border);outline:none;background:var(--mixtouring-input);border-radius:12px;padding:11px 14px;font-size:14.5px;font-family:inherit;color:var(--mixtouring-foreground);" />
        </div>
        <div style="flex:1;min-width:150px;">
          <div style="font-size:12px;color:var(--mixtouring-muted-foreground);margin-bottom:6px;">目的地</div>
          <input id="toInput" type="text" placeholder="目的地城市" aria-label="目的地"
                 style="width:100%;box-sizing:border-box;border:0.5px solid var(--mixtouring-border);outline:none;background:var(--mixtouring-input);border-radius:12px;padding:11px 14px;font-size:14.5px;font-family:inherit;color:var(--mixtouring-foreground);" />
        </div>
        <button id="btnSearch" style="background:var(--mixtouring-primary);color:var(--mixtouring-primary-foreground);border:none;border-radius:12px;padding:12px 22px;font-size:14px;font-family:inherit;cursor:pointer;">聊聊旅行想法</button>
      </div>
      </details>

      <details id="moreConditions" style="margin-top:3px;">
        <summary style="cursor:pointer;font-size:12px;color:var(--mixtouring-muted-foreground);padding:8px 0;">补充日期或具体限制（可稍后再说）</summary>

      <!-- 行程信息（v0.35.0 十轮 P0：往返/日期/人数不回退；字段优先于一句话提取） -->
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
        <label style="font-size:12px;color:var(--mixtouring-muted-foreground);">行程类型
          <select id="tvType" style="display:block;margin-top:4px;border:0.5px solid var(--mixtouring-border);border-radius:8px;padding:8px;font-size:13.5px;font-family:inherit;background:#fff;">
            <option value="">待确认（按单程探索）</option>
            <option value="round_trip">往返</option>
            <option value="one_way">单程</option>
          </select>
        </label>
        <label style="font-size:12px;color:var(--mixtouring-muted-foreground);flex:1 1 245px;min-width:0;">去程窗口 <input id="tvOut" type="text" placeholder="2026-09-27 ~ 2026-10-03" style="display:block;margin-top:4px;width:100%;box-sizing:border-box;border:0.5px solid var(--mixtouring-border);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;" /></label>
        <label style="font-size:12px;color:var(--mixtouring-muted-foreground);flex:1 1 245px;min-width:0;">返程窗口 <input id="tvRet" type="text" placeholder="2026-10-05 ~ 2026-10-11" style="display:block;margin-top:4px;width:100%;box-sizing:border-box;border:0.5px solid var(--mixtouring-border);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;" /></label>
        <label style="font-size:12px;color:var(--mixtouring-muted-foreground);">人数 <input id="tvCount" type="number" min="1" max="9" placeholder="1" style="display:block;margin-top:4px;width:70px;box-sizing:border-box;border:0.5px solid var(--mixtouring-border);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;" /></label>
      </div>

      <!-- 约束行（v0.34.0 统一主入口：四类约束随主查询提交；字段优先于一句话表述） -->
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
        <label style="font-size:12px;color:var(--mixtouring-muted-foreground);">预算（元） <input id="cnBudget" type="number" min="100" step="100" placeholder="不限" style="display:block;margin-top:4px;width:110px;box-sizing:border-box;border:0.5px solid var(--mixtouring-border);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;" /></label>
        <label style="font-size:12px;color:var(--mixtouring-muted-foreground);">最长中转（小时） <input id="cnLayover" type="number" min="0.5" step="0.5" placeholder="不限" style="display:block;margin-top:4px;width:110px;box-sizing:border-box;border:0.5px solid var(--mixtouring-border);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;" /></label>
        <label style="font-size:12px;color:var(--mixtouring-muted-foreground);">夜间到达
          <select id="cnNight" style="display:block;margin-top:4px;border:0.5px solid var(--mixtouring-border);border-radius:8px;padding:8px;font-size:13.5px;font-family:inherit;background:#fff;">
            <option value="">不限</option>
            <option value="avoid">不接受</option>
            <option value="allow">可接受</option>
          </select>
        </label>
        <label style="font-size:12px;color:var(--mixtouring-muted-foreground);">换乘（次） <input id="cnTransfers" type="number" min="0" max="2" step="1" placeholder="不限" style="display:block;margin-top:4px;width:90px;box-sizing:border-box;border:0.5px solid var(--mixtouring-border);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;" /></label>
      </div>
      <div style="font-size:11.5px;color:var(--mixtouring-muted-foreground);margin-top:8px;line-height:1.6;">可输入城市、机场、车站或景点；遇到重名地点会请你选择。</div>

      <!-- 卡 B（v0.44.2）：已确定的去/返交通（锚点）——用户确认事实；规划不重算锚点段 -->
      <details id="anchorPanel" style="margin-top:12px;">
        <summary style="font-size:13px;color:var(--mixtouring-muted-foreground);cursor:pointer;min-height:44px;">已有机票或车次？填入已定交通</summary>
        <div id="anchorForms" style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;"></div>
        <div style="font-size:12px;color:var(--mixtouring-muted-foreground);margin-top:8px;line-height:1.6;">照着票据填入去返交通，规划会保留这些安排；其余接驳继续补充。</div>
        <div id="anchorHint" style="font-size:12px;color:#A8543A;margin-top:6px;line-height:1.6;"></div>
        <div id="anchorStatus"></div>
      </details>
      </details>
      </div>
    </div>

    <!-- M2：跨旅行偏好记忆——独立本机存储，默认关闭；与旅行快照隔离 -->
    <details id="prefMemoryPanel" style="margin-top:12px;">
      <summary style="font-size:13px;color:var(--mixtouring-muted-foreground);cursor:pointer;min-height:44px;">跨旅行偏好记忆<span id="prefMemoryState" style="margin-left:8px;"></span></summary>
      <div style="margin-top:10px;padding:12px 14px;border:0.5px solid var(--mixtouring-border);border-radius:14px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mixtouring-foreground);"><input id="prefMemoryToggle" type="checkbox" /> 记住我的长期旅行偏好（节奏、交通方式等；仅保存在本机浏览器）</label>
        <div id="prefMemoryList" style="margin-top:8px;"></div>
        <p id="prefMemoryNote" role="status" aria-live="polite" style="font-size:12px;line-height:1.6;"></p>
        <button id="prefMemoryRetry" type="button" hidden style="min-height:44px;">重新读取本机偏好</button>
        <div style="font-size:11.5px;color:var(--mixtouring-muted-foreground);margin-top:8px;line-height:1.6;">只记录你在对话中明确表达的长期软偏好；日期、预算、必经城市等一次性条件不会被记住。关闭后立即停止召回与记录；删除的条目不会因恢复旧行程而回来。</div>
      </div>
    </details>

    <!-- 结果区：先展示走法，核查信息按需展开 -->
    <div id="planStatus" role="status" aria-live="polite"></div>
    <div id="workspaceTabs" class="workspace-tabs" hidden aria-label="规划视图"><button type="button" data-workspace-tab="chat" aria-pressed="true">对话</button><button type="button" data-workspace-tab="route" aria-pressed="false">路线与安排</button></div>
    <div class="planning-workspace">
      <aside id="guideArea" aria-label="一起规划" hidden></aside>
      <div id="planColumn" hidden>
        <section id="routeDecision" class="decision-host" hidden aria-label="路线比较"></section>
        <section id="routeResearchProgress" class="route-research-progress" hidden aria-label="关键交通补查"></section>
        <section id="taskPreview" class="sight-panel current-plan" hidden aria-label="当前方案"></section>
        <details id="routeOptions" class="route-options" hidden><summary>比较走法与查看交通资料</summary><div id="resultArea" style="margin-top:12px;"></div></details>
      </div>
    </div>
    <details id="sightDetails" class="sight-panel" hidden><summary>在伊犁玩几天</summary><div id="sightContent"></div></details>
  </main>

  <script src="../assets/sight-planner.js"></script>
  <script src="../assets/route-workspace.js"></script>
  <script src="../assets/vendor/leaflet/leaflet.js"></script>
  <script src="../assets/discovery-workspace.js"></script>

  <script>
  (function () {
    var resultArea = document.getElementById('resultArea');
    var composer=document.getElementById('conversationComposer');
    function showWorkspaceView(view) {
      document.body.dataset.workspaceView=view;
      document.querySelectorAll('[data-workspace-tab]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.workspaceTab===view));});
      if(view==='chat'){var messages=document.querySelector('#guideArea .guide-messages');if(messages)messages.scrollTop=messages.scrollHeight;}
      if(view==='route')requestAnimationFrame(function(){document.querySelectorAll('.discovery-map').forEach(function(host){MTDiscovery.invalidate(host);});});
    }
    document.querySelectorAll('[data-workspace-tab]').forEach(function(b){b.onclick=function(){showWorkspaceView(b.dataset.workspaceTab);};});
    document.querySelectorAll('[data-idea]').forEach(function(b){b.onclick=function(){document.getElementById('nlInput').value=b.dataset.idea;updateComposer();document.getElementById('nlInput').focus();};});
    var entryParams = new URLSearchParams(location.search);
    if (entryParams.get('from')) document.getElementById('fromInput').value = entryParams.get('from');
    if (entryParams.get('to')) document.getElementById('toInput').value = entryParams.get('to');

    function post(url, body, signal) {
      return fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: signal })
        .then(function (r) { return r.json(); });
    }
    async function postPlan(body, signal, receive) {
      var response = await fetch('/api/anywhere/plan', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify(Object.assign({}, body, { progressive: true })), signal: signal });
      if (!response.ok) throw new Error('规划服务不可用');
      if (!(response.headers.get('content-type') || '').includes('ndjson')) return receive(await response.json());
      var reader = response.body.getReader(), decoder = new TextDecoder(), buffer = '', complete = false;
      while (true) {
        var part = await reader.read();
        buffer += decoder.decode(part.value || new Uint8Array(), { stream: !part.done });
        var lines = buffer.split('\n'); buffer = lines.pop();
        for (var line of lines) {
          if (!line.trim()) continue;
          var event = JSON.parse(line);
          if (event.code !== 0) throw new Error(event.msg);
          receive(event);
          if (event.phase === 'complete') complete = true;
        }
        if (part.done) break;
      }
      if (!complete) throw new Error('补充搜索中断');
      return true;
    }

    /* ---------- 统一主入口：两字段与一句话进同一状态机（/api/anywhere/plan） ----------
     * 状态：idle → planning → needs_confirm（地点候选确认卡，保留原输入与约束）→ results / blocked。
     * 对用户先呈现路线与取舍；服务能力诊断留在接口，不进入结果主路径。 */
    var AW_KIND = { city: '城市', airport: '机场', station: '车站', poi: '景点' };
    var AW_MODE = { plane: '航班', rail: '铁路', road: '公路客运' };
    var lastRequest = null; /* {text} 或 {origin,destination}，含 constraints——确认与重放共用 */
    var confirmedPlaces = {}, activePlan = null, activeCandidate = null, activeNights = 0;
    var revisions = [], pendingRestore = null;
    var guideState = MTGuide.clean(), guideMessages = [], guideUndo = [], guideProposal = null;
    var arrivalWindow = null, planSequence = 0, planController = null, guideSequence = 0, journeySequence = 0;
    var SESSION_KEY = 'mt:planning-session';
    var planning = false;
    var transportReferenceCache=new Map(), transportReferenceLoading=new Set(), transportReferenceErrors=new Set();
    var transportSearchCache=new Map(),transportSearchLoading=new Set(),transportSearchErrors=new Set();
    var msgSeq=0; /* #31：消息稳定身份，用于重绘时保持阅读锚点与引用展开状态 */
    var conversationController=null; /* #32：对话与交通检索请求的取消句柄，重新开始时中止旧请求 */
    var conversation = null, conversationBusy = false, conversationError = null;
    var comparisonCache=new Map(),comparisonLoading=new Set(),comparisonErrors=new Set();
    var savedDraftId=null,saveFailure=null,researchScope=null,researchTasks=null,researchHydrationKey=null,researchJournalError=false;
    var researchJournal=MTResearchTasks.journal({getItem:function(k){return localStorage.getItem(k);},setItem:function(k,v){localStorage.setItem(k,v);}});
    var routeResearch=MTRouteResearch.create({request:function(input,signal){return post(input.kind==='draft'?'/api/anywhere/transport-search-batch':'/api/anywhere/route-research',input,signal);},onChange:function(){renderResearchProgress();renderGuide();}});

    /* ---------- 卡 B（v0.44.2）：交通锚点（用户确认事实）与会话级新约束 ----------
     * anchors.outbound/return：已锁定的去/返交通；extraConstraints：不开车与住宿约束（无输入框，由对话确认进入）。
     * 多轮修改中不丢失；锚点只由用户在面板上锁定/修改/撤销。 */
    var anchors = { outbound: null, return: null };
    var extraConstraints = {};
    var ANCHOR_DIR_LABEL = { outbound: '去程', return: '返程' };
    var ANCHOR_MODE_TEXT = { plane: '航班', rail: '火车', road: '公路班线' };
    function anchorPrefix(dir) { return dir === 'outbound' ? 'anOut' : 'anRet'; }
    function buildAnchorForms() {
      var box = document.getElementById('anchorForms');
      box.innerHTML = ['outbound', 'return'].map(function (dir) {
        var p = anchorPrefix(dir);
        var field = function (id, label, control) {
          return '<label style="font-size:12px;color:var(--mixtouring-muted-foreground);"> ' + label + control + '</label>';
        };
        return '<div id="' + p + 'Card" style="flex:1 1 320px;min-width:0;padding:12px;border:0.5px solid var(--mixtouring-border);border-radius:14px;">' +
          '<div style="font-size:13px;">' + ANCHOR_DIR_LABEL[dir] + '交通</div>' +
          field(p + 'Mode', '方式', '<select id="' + p + 'Mode" style="display:block;margin-top:4px;border:0.5px solid var(--mixtouring-border);border-radius:8px;padding:7px;font-size:13px;font-family:inherit;background:#fff;"><option value="">待选择</option><option value="plane">航班</option><option value="rail">火车</option><option value="road">公路班线</option></select>') +

          fillAnchorForm('outbound', anchors.outbound);
          fillAnchorForm('return', anchors.return);
          renderAnchorStatus();
        }
        restoreConstraintSnapshot(saved.constraints);
        MTSights.restore(saved.sights);
      }
      travelDirty = { type: false, out: false, ret: false, count: false };
      hydrateResearchTasks();
      MT.toast('已从草案回填，正在重新规划（开放地点须重新确认）');
      requestPlan();
    })();

    composer.addEventListener('submit', function (event) {
      event.preventDefault();if(conversationBusy)return;
      var text = document.getElementById('nlInput').value.trim();
      if (!text) return;
      if(conversation){
        if(conversationError && conversationError.text===text){
          if(conversationError.action==='generate'){if(conversationError.requested_candidate_id)sendConversation(text,true,'generate',conversationError.requested_candidate_id);else generateConversation();return;}
          sendConversation(text,true);return;
        }
        sendConversation(text);return;
      }
      confirmedPlaces = {};
      clearAutoFilledTravel();
      resetGuide(text);
      lastRequest = { text: text, constraints: collectConstraints() };
      startConversation(text);
    });

    function placeLabel(name, kind) {
      return MT.esc(name || '') + (AW_KIND[kind] ? '<span style="font-size:11px;color:var(--mixtouring-muted-foreground);">（' + AW_KIND[kind] + '）</span>' : '');
    }

    /* 内联地点确认卡：只回传服务端签发的 candidate_id；候选过期由服务端拒绝并在此提示重新核验 */
    function confirmBoxHtml(data) {
      var html = '';
      ['origin', 'destination'].forEach(function (ep) {
        var list = (data.place_candidates && data.place_candidates[ep]) || [];
        if (!list.length) return;
        html += '<div style="margin-top:12px;padding:14px 16px;border-radius:14px;background:rgba(30,127,69,0.06);border:0.5px solid rgba(30,127,69,0.25);">';
        html += '<div style="font-size:13px;">新地点待确认——' + (ep === 'origin' ? '出发地' : '目的地') + '（候选均经 OpenStreetMap 核验；重名请按行政层级与来源选对；30 分钟内有效）</div>';
        list.forEach(function (c) {
          html += '<label style="display:flex;align-items:flex-start;gap:8px;margin-top:10px;cursor:pointer;">' +
            '<input type="radio" name="awc-' + ep + '" value="' + MT.esc(c.candidate_id || '') + '" style="margin-top:3px;" />' +
            '<span style="font-size:12.5px;line-height:1.6;">' + placeLabel(c.name, c.kind) +
            ' <span style="color:var(--mixtouring-muted-foreground);">· ' + MT.esc(c.country || '') + (c.country_name ? '（' + MT.esc(c.country_name) + '）' : '') + '</span>' +
            (c.source_url && /^https:/.test(c.source_url) ? ' <a href="' + MT.esc(c.source_url) + '" target="_blank" rel="noopener" style="font-size:11.5px;color:#1E7F45;">来源 ›</a>' : '') +
            (c.detail ? '<br><span style="font-size:11.5px;color:var(--mixtouring-muted-foreground);">' + MT.esc(c.detail) + '</span>' : '') +
            (!c.detail && c.note ? '<br><span style="font-size:11.5px;color:var(--mixtouring-muted-foreground);">' + MT.esc(c.note) + '</span>' : '') +
            '</span></label>';
        });
        html += '</div>';
      });
      if (!html) return '';
      return html + '<p style="font-size:12px;color:#A16207;line-height:1.6;">没有目标地点？在对话中补充国家或地区即可。</p>' +
        '<button id="btnAwConfirm" style="margin-top:12px;min-height:44px;background:var(--mixtouring-primary);color:var(--mixtouring-primary-foreground);border:none;border-radius:10px;padding:11px 20px;font-size:13.5px;font-family:inherit;cursor:pointer;">确认地点并生成方案</button>';
    }

    function candidateTitle(c) {
      return c.variant === 'plane' ? '直达航班' : c.variant === 'rail' ? '直达铁路' :
        c.kind === 'direct' ? '直达方向' : c.kind === 'one_transfer' ? '经停一座城市' :
          c.kind === 'discovered' ? '沿途探索' : '铁路＋航班';
    }

    /* 十一轮 P1：解析意图回填到仍为空的行程信息控件（已有用户显式输入不覆盖）——
     * 消除「结果摘要显示往返、表单显示待确认」的双状态；后续确认/重新规划读当前表单值 */
    function backfillForm(data) {
      var it = data.intent || {};
      var fills = [
        ['tvType', it.trip_type && it.trip_type !== 'pending' ? it.trip_type : ''],
        ['tvOut', it.outbound_window || ''],
        ['tvRet', it.return_window || ''],
        ['tvCount', it.traveler_count != null ? String(it.traveler_count) : '']
      ];
      fills.forEach(function (p) {
        var el = document.getElementById(p[0]);
        if (el && el.value === '') el.value = p[1];
      });
    }
    function renderUnified(data) {
      syncPlanLayout();
      backfillForm(data);
      /* 修改语句解析出的结构化约束也回填，避免结果与上方控件出现两套状态。 */
      var resolvedConstraints = data.intent.constraints || {};
      document.getElementById('cnBudget').value = resolvedConstraints.budget_max_cny == null ? '' : resolvedConstraints.budget_max_cny;
      document.getElementById('cnLayover').value = resolvedConstraints.max_layover_hours == null ? '' : resolvedConstraints.max_layover_hours;
      document.getElementById('cnNight').value = resolvedConstraints.night_arrival || '';
      document.getElementById('cnTransfers').value = resolvedConstraints.max_transfers == null ? '' : resolvedConstraints.max_transfers;
      fillConstraints(resolvedConstraints);
      MTSights.refresh();
      var html = '<div class="detail-card" style="background:var(--mixtouring-card);border-radius:20px;padding:20px;box-shadow:var(--shadow-card-soft);">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
        '<h2 style="font-size:17px;margin:0;">' + placeLabel(data.intent.origin || '（待确认）', data.intent.origin_place && data.intent.origin_place.kind) +
        ' → ' + placeLabel(data.intent.destination || '（待确认）', data.intent.destination_place && data.intent.destination_place.kind) + '</h2></div>';
      if (data.candidates.length) html += '<p style="font-size:12px;color:var(--mixtouring-muted-foreground);margin:8px 0 0;line-height:1.6;">以下是值得探索的走法。班次、价格和衔接请在决定出行前查询。</p>';
      if (data.intent.constraint_chips && data.intent.constraint_chips.length) {
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
          data.intent.constraint_chips.map(function (c) {
            return '<span style="font-size:12px;padding:4px 12px;border-radius:9999px;background:rgba(30,127,69,0.08);color:#1E7F45;">' + MT.esc(c.label) + '</span>';
          }).join('') + '</div>';
      }
      /* 卡 B：锚点（用户确认事实）与锚点说明——与待验证候选区分呈现 */
      if (data.anchors && (data.anchors.outbound || data.anchors.return)) {
        html += '<div style="margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(30,127,69,0.07);border:1px solid rgba(30,127,69,0.35);">' +
          '<div style="font-size:12.5px;color:#1E7F45;">已锁定交通（你确认的事实，规划不重算这些段）</div>' +
          ['outbound', 'return'].filter(function (dir) { return data.anchors[dir]; }).map(function (dir) {
            var a = data.anchors[dir];
            return '<div style="font-size:12px;margin-top:4px;">' + (dir === 'outbound' ? '去程' : '返程') + '：' + MT.esc(a.from_city) + ' → ' + MT.esc(a.to_city) + ' · ' +
              MT.esc(ANCHOR_MODE_TEXT[a.mode] || a.mode) + ' · ' + MT.esc(a.date) + (a.service_no ? ' · ' + MT.esc(a.service_no) : '') + '</div>';
          }).join('') + '</div>';
      }
      (data.anchor_notes || []).forEach(function (n) {
        html += '<div style="margin-top:6px;font-size:12px;color:var(--mixtouring-muted-foreground);line-height:1.6;">· ' + MT.esc(n) + '</div>';
      });
      /* 行程意图摘要（v0.35.0 P0：往返/日期/人数可见且不回退） */
      var tvLabels = [];
      if (data.intent.trip_type === 'round_trip') tvLabels.push('往返');
      else if (data.intent.trip_type === 'one_way') tvLabels.push('单程');
      if (data.intent.outbound_window) tvLabels.push('去程 ' + data.intent.outbound_window);
      if (data.intent.arrival_window) tvLabels.push('希望到达 ' + data.intent.arrival_window);
      if (data.intent.return_window) tvLabels.push('返程 ' + data.intent.return_window);
      if (data.intent.traveler_count != null) tvLabels.push(data.intent.traveler_count + ' 人');
      if (tvLabels.length) {
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">' +
          tvLabels.map(function (l) {
            return '<span style="font-size:12px;padding:4px 12px;border-radius:9999px;background:var(--mixtouring-muted);color:var(--mixtouring-muted-foreground);">' + MT.esc(l) + '</span>';
          }).join('') + '</div>';
      }
      (data.needs_confirmation || []).filter(function (n) {
        return !data.candidates.length || !/行程类型未识别|已记录希望到达时间|往返行程请补/.test(n);
      }).forEach(function (n) {
        html += '<div style="margin-top:8px;font-size:12.5px;color:#A8543A;">· ' + MT.esc(n) + '</div>';
      });
      /* 候选无效/过期：显式提示重新核验（不把失败静默吞掉） */
      if ((data.needs_confirmation || []).some(function (n) { return n.indexOf('无效或已过期') >= 0; })) {
        html += '<button id="btnReplan" style="margin-top:10px;background:var(--mixtouring-muted);color:var(--mixtouring-foreground);border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-family:inherit;cursor:pointer;">重新规划（重新核验地点候选）</button>';
      }
      html += confirmBoxHtml(data);
      html += '<div id="revisionBar" style="margin-top:10px;"></div>';
      html += '</div>';

      var ranked = MTGuide.rank(data.candidates, guideState);
      if (ranked.omitted) html += '<p style="font-size:12px;">按你的要求隐藏了 ' + ranked.omitted + ' 条公路客运走法，可在对话中撤销。</p>';
      if (!ranked.items.length && data.candidates.length) html += '<p>当前条件下没有剩余走法。可撤销刚才的要求，重新比较。</p>';
      var routeGroups=MTGuide.groups(ranked.items),displayItems=[];
      routeGroups.forEach(function(group,groupIndex){group.items.forEach(function(item,variant){displayItems.push(Object.assign({},item,{groupIndex:groupIndex,variant:variant,variants:group.items.length,lastVariant:variant===group.items.length-1}));});});
      displayItems.forEach(function (item,index) {
        if(item.groupIndex===3 && item.variant===0) html+='<details class="other-routes"><summary>再看 '+(routeGroups.length-3)+' 个方向</summary>';
        if(item.variant===1) html+='<details class="route-variants"><summary>同一路径的其他交通组合</summary>';
        var c = item.candidate;
        html += '<div class="detail-card mt-route-card" style="margin-top:12px;">';
        if(index===0) html+='<p class="mt-route-label">优先考虑</p>';
        if (c.inspiration_id) html += '<p class="mt-route-label">从路线灵感继续探索</p>';
        else if (c.basis && c.basis.rule === 'historical-inspiration') html += '<p class="mt-route-label">国内历史路线结构 · 班期、费用与耗时待查</p>';
        html += '<div style="font-size:15px;">' + MT.esc(candidateTitle(c)) + '</div>';
        if (item.reason) html += '<div class="preference-note">' + MT.esc(item.reason) + '</div>';
        html += '<div style="font-size:13px;margin-top:7px;line-height:1.6;">' + c.legs.map(function (leg, i) {
          return (i ? ' → ' : '') + placeLabel(leg.from, leg.from_kind);
        }).join('') + ' → ' + placeLabel(c.legs[c.legs.length - 1].to, c.legs[c.legs.length - 1].to_kind) + '</div>';
        html += '<div style="font-size:12px;color:var(--mixtouring-muted-foreground);margin-top:4px;">' + c.legs.map(function (leg) {
          return MT.esc(AW_MODE[leg.mode_guess] || '方式待查') + (leg.via ? '（途经' + MT.esc(leg.via) + '）' : '');
        }).join(' → ') + '</div>';
        html += '<div style="margin-top:9px;font-size:12.5px;line-height:1.65;">' + MT.esc(MTGuide.reason(c)) + '</div>';
        var tradeoff = c.kind === 'direct' ? '不用换乘，行程组织更简单' :
          c.kind === 'discovered' ? (data.route && data.route.route_type === 'international'
            ? '可以沿途停留；各段衔接与跨境流程需核查' : '可以沿途停留；各段客运连接、班期与衔接需核查') :
          c.kind === 'mixed' ? '增加铁路与航班接驳，可选择在中转城市停留' : '多一次换乘，可选择在中转城市停留';
        html += '<div style="margin-top:4px;font-size:12px;color:var(--mixtouring-muted-foreground);line-height:1.65;">主要取舍：' + tradeoff + '</div>';
        html += '<button type="button" class="btnJourney" data-candidate="' + MT.esc(c.id) + '" style="margin-top:12px;min-height:44px;padding:10px 18px;border:0;border-radius:10px;background:var(--mixtouring-primary);color:#fff;font-family:inherit;cursor:pointer;">' +
          (c.kind === 'direct' ? '查看走法详情' : '查看详情与停留选择') + '</button>';
        html += '<details style="margin-top:10px;font-size:12px;color:var(--mixtouring-muted-foreground);"><summary style="cursor:pointer;min-height:28px;">查看路线依据与待查项</summary>';
        if(c.why_explore) html+='<p>'+MT.esc(c.why_explore)+'</p>';
        c.legs.forEach(function (leg) {
          var lead = leg.evidence_state === 'source_lead';
          html += '<div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--mixtouring-muted);">' +
            '<div style="font-size:12.5px;">第 ' + leg.seq + ' 段 · ' + placeLabel(leg.from, leg.from_kind) + ' → ' + placeLabel(leg.to, leg.to_kind) +
            ' <span style="font-size:11.5px;color:var(--mixtouring-muted-foreground);">' + MT.esc(AW_MODE[leg.mode_guess] || '方式待查') + '</span></div>' +
            (lead ? '<div style="margin-top:4px;">' + leg.sources.map(function (s) {
              return '<a href="' + MT.esc(s.link) + '" target="_blank" rel="noopener" style="font-size:11.5px;color:#1E7F45;margin-right:10px;">' + MT.esc(s.title) + ' ›</a>';
            }).join('') + '</div>' : '') +
            '<div style="margin-top:4px;font-size:11.5px;color:var(--mixtouring-muted-foreground);">' + MT.esc(leg.manual_check) + '</div>' +
            '</div>';
        });
        /* 直达铁路卡的走廊依据来源（P2 结构化：可点开核对；仍只是假设依据，非当期班期） */
        var src = c.basis && c.basis.rule === 'known-corridor' && c.basis.source_url;
        if (src) {
          html += '<div style="margin-top:8px;font-size:11.5px;color:var(--mixtouring-muted-foreground);">铁路依据：' + MT.esc(c.basis.corridor || '') +
            '（' + MT.esc(c.basis.evidence || '') + '；取样 ' + MT.esc(String(c.basis.sampled_at || '').slice(0, 10)) + '，来源复核期限 ' + MT.esc(c.basis.review_by || '') + '——复核期限非运营有效期，命中仍只是待验证假设）' +
            ' <a href="' + MT.esc(src) + '" target="_blank" rel="noopener" style="color:#1E7F45;">来源 ›</a></div>';
        }
        if (c.basis && ['search-discovery', 'curated-inspiration', 'historical-inspiration'].includes(c.basis.rule) && Array.isArray(c.basis.sources)) {
          html += '<div style="margin-top:8px;font-size:11.5px;line-height:1.7;">' +
            (c.basis.rule === 'historical-inspiration' ? '历史结构参考：' : '发现线索：') + c.basis.sources.map(function (s) {
            if (!/^https:\/\//.test(s.link || '')) return '<span>' + MT.esc(s.title) + '</span>';
            return '<a href="' + MT.esc(s.link) + '" target="_blank" rel="noopener" style="color:#1E7F45;margin-right:10px;">' + MT.esc(s.title) + ' ›</a>';
          }).join('') + '</div>';
        }
        /* 详细依据仅在用户主动展开时出现；推荐理由已在卡片正面呈现。 */
        html += '<div style="margin-top:10px;font-size:12px;line-height:1.7;">' + MT.esc(c.explanation) + '</div>';
        if (c.uncertain_leg) html += '<div style="margin-top:4px;font-size:12px;line-height:1.7;"><span style="color:#A16207;">待核路段：</span>' + MT.esc(c.uncertain_leg) + '</div>';
        if (c.next_checks && c.next_checks.length) html += '<div style="margin-top:4px;font-size:12px;line-height:1.7;"><span style="color:var(--mixtouring-ring);">下一步：</span>' + c.next_checks.map(function (n) { return MT.esc(n); }).join('；') + '</div>';
        /* G3 首段：相对直达取舍（时间/费用/体验/风险；structural=结构事实，qualitative=定性判断） */
        if (c.tradeoffs && c.tradeoffs.length) {
          html += '<details style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--mixtouring-muted);">' +
            '<summary style="font-size:12px;cursor:pointer;min-height:24px;">相对直达的取舍 · 时间／费用／体验／风险</summary>' +
            c.tradeoffs.map(function (x) {
              var tag = x.basis_kind === 'structural'
                ? '<span style="font-size:10.5px;color:#1E7F45;">[结构事实]</span>'
                : '<span style="font-size:10.5px;color:#A16207;">[定性判断]</span>';
              return '<div style="margin-top:6px;font-size:11.5px;line-height:1.7;"><strong>' + MT.esc(x.dimension) + '</strong> ' + tag +
                '<br>直达：' + MT.esc(x.direct_ref) + '<br>本方案：' + MT.esc(x.this_route) + '</div>';
            }).join('') + '</details>';
        }
        /* G3 首段：脆弱段与备选方向 */
        if (c.fragile_legs && c.fragile_legs.length) {
          html += '<div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(161,98,7,0.06);border:0.5px solid rgba(161,98,7,0.25);">' +
            '<div style="font-size:12px;color:#A16207;">脆弱段与备选</div>' +
            c.fragile_legs.map(function (fl) {
              return '<div style="margin-top:6px;font-size:11.5px;line-height:1.7;">' + MT.esc(fl.leg) +
                '<br>' + fl.reasons.map(function (r) { return '· ' + MT.esc(r); }).join('<br>') +
                '<br><span style="color:var(--mixtouring-muted-foreground);">备选：</span>' + fl.fallbacks.map(function (fb) { return MT.esc(fb); }).join('；') + '</div>';
            }).join('') + '</div>';
        }
        html += '</details></div>';
        if(item.lastVariant && item.variant>0) html+='</details>';
        if(index===displayItems.length-1 && item.groupIndex>=3) html+='</details>';
      });

      if ((data.explorations || []).length && !(data.candidates || []).some(function (c) {
        return c.kind === 'discovered' && (c.legs || []).some(function (leg) { return leg.mode_guess === 'road'; });
      })) {
        html += '<div style="margin-top:12px;padding:14px 16px;border-radius:14px;background:rgba(161,98,7,0.06);border:0.5px solid rgba(161,98,7,0.25);">' +
          '<div style="font-size:13px;">也可探索铁路与陆路接驳</div>' +
          '<div style="font-size:12px;color:var(--mixtouring-muted-foreground);margin-top:6px;line-height:1.7;">可沿铁路枢纽与陆路口岸继续寻找组合走法。</div></div>';
      }
      (data.constraint_notes || []).forEach(function (n) {
        html += '<div style="margin-top:8px;font-size:12px;color:#A16207;">· ' + MT.esc(n) + '</div>';
      });
      var placeCandidates = data.place_candidates || {};
      if (!data.candidates.length && !(data.anchors && data.anchors.full_cover) && !((placeCandidates.origin || []).length || (placeCandidates.destination || []).length)) {
        var placeUnavailable = (data.degradations || []).some(function (n) { return /核验通道不可用|未找到可核验/.test(n); });
        html += '<div style="margin-top:12px;font-size:12.5px;color:#A16207;line-height:1.7;">' +
          (placeUnavailable ? '地点暂时无法确认，请补充国家或地区后重试。' : '暂时没有找到可参考的走法，请调整地点或条件后重试。') + '</div>';
      }
      html += '<div id="journeyArea" style="margin-top:14px;"></div>';
      html += '</div>';
      resultArea.innerHTML = html;
      renderRevisionBar();
      renderGuide();

      var btnConfirm = document.getElementById('btnAwConfirm');
      if (btnConfirm) btnConfirm.addEventListener('click', function () {
        var confirmed = {}, needPick = false;
        ['origin', 'destination'].forEach(function (ep) {
          var list = (data.place_candidates && data.place_candidates[ep]) || [];
          if (!list.length) return;
          var sel = document.querySelector('input[name="awc-' + ep + '"]:checked');
          if (!sel || !sel.value) { needPick = true; return; } /* 无默认选中：必须显式选择 */
          confirmed[ep] = sel.value; /* 只回传服务端签发的 candidate_id */
        });
        ['origin', 'destination'].forEach(function (ep) {
          var list = (data.place_candidates && data.place_candidates[ep]) || [];
          if (list.length && !confirmed[ep]) needPick = true;
        });
        if (needPick) { MT.toast('重名候选请先选择一个再确认'); return; }
        if (!confirmed.origin && !confirmed.destination) { MT.toast('没有可确认的候选'); return; }
        requestPlan(confirmed).then(function(ok){if(ok!==false && conversation && !conversation.draft && activePlan && activePlan.plan_id)sendConversation('按已确认的旅行想法生成初步方案。',false,'generate');});
      });
      var btnReplan = document.getElementById('btnReplan');
      if (btnReplan) btnReplan.addEventListener('click', function () { requestPlan(); });
      document.querySelectorAll('.btnJourney').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-candidate');
          var c = activePlan.candidates.find(function (x) { return x.id === id; });
          openJourney(id, c.kind === 'direct' ? 0 : guideState.nights || 0, true);
        });
      });
    }

    /* G3：只通过服务端 plan_id 取详情，修改后重新规划；版本只保存本次会话的输入与选择。 */
    function revisionSnapshot(candidateId, nights) {
      var candidate = activePlan && activePlan.candidates.find(function (c) { return c.id === candidateId; });
      return {
        request: JSON.parse(JSON.stringify(lastRequest || {})),
        confirmed: Object.assign({}, confirmedPlaces),
        travel: collectTravel(), constraints: collectConstraints(),
        sights: MTSights.getState(),
        preferences: guideState, messages: guideMessages, conversation: conversation, candidate_key: selectedKey(),
        candidate_id: candidateId, candidate_label: candidate ? candidateTitle(candidate) : '待重新选择走法', nights: nights
      };
    }
    function recordRevision(candidateId, nights) {
      var next = revisionSnapshot(candidateId, nights);
      var prev = revisions[revisions.length - 1];
      if (prev && JSON.stringify(prev) === JSON.stringify(next)) return;
      revisions.push(JSON.parse(JSON.stringify(next)));
      renderRevisionBar();
    }
    function renderRevisionBar() {
      var bar = document.getElementById('revisionBar');
      if (!bar || !revisions.length) return;
      bar.innerHTML = '<div style="font-size:12px;">本次会话版本（可对照条件，恢复时重新核验）：' + revisions.map(function (rev, i) {
        var summary = [rev.candidate_label || '待重新选择走法'];
        if (rev.travel.trip_type === 'round_trip') summary.push('往返');
        else if (rev.travel.trip_type === 'one_way') summary.push('单程');
        if (rev.travel.outbound_window) summary.push('去 ' + rev.travel.outbound_window);
        if (rev.travel.return_window) summary.push('返 ' + rev.travel.return_window);
        if (rev.nights) summary.push('停 ' + rev.nights + ' 晚');
        if (rev.constraints.night_arrival === 'avoid') summary.push('避免夜间到达');
        if (rev.constraints.max_transfers != null) summary.push('最多换乘 ' + rev.constraints.max_transfers + ' 次');
        if (rev.constraints.budget_max_cny != null) summary.push('预算 ≤ ¥' + rev.constraints.budget_max_cny);
        return '<button type="button" class="btnRevision" data-revision="' + i + '" style="display:inline-block;text-align:left;vertical-align:top;margin:4px;padding:8px 10px;min-height:44px;max-width:270px;border:1px solid var(--mixtouring-border);background:#fff;border-radius:9px;font-family:inherit;cursor:pointer;">版本 ' + (i + 1) + '<span style="display:block;font-size:11px;color:var(--mixtouring-muted-foreground);line-height:1.5;">' + MT.esc(summary.join(' · ')) + '</span></button>';
      }).join('') + '</div>';
      bar.querySelectorAll('.btnRevision').forEach(function (btn) { btn.addEventListener('click', function () { restoreRevision(Number(btn.getAttribute('data-revision'))); }); });
    }
    function restoreRevision(index) {
      var rev = revisions[index];
      if (!rev) return;
      restoreConstraintSnapshot(rev.constraints);
      MTSights.restore(rev.sights);
      lastRequest = JSON.parse(JSON.stringify(rev.request));
      conversation = rev.conversation || null;
      guideState = MTGuide.clean(rev.preferences); guideMessages = historicalMessages(rev.messages);
      arrivalWindow = rev.travel.arrival_window || null;
      confirmedPlaces = Object.assign({}, rev.confirmed);
      document.getElementById('fromInput').value = rev.request.origin || '';
      document.getElementById('toInput').value = rev.request.destination || '';
      document.getElementById('nlInput').value = '';
      document.getElementById('tvType').value = rev.travel.trip_type || '';
      document.getElementById('tvOut').value = rev.travel.outbound_window || '';
      document.getElementById('tvRet').value = rev.travel.return_window || '';
      document.getElementById('tvCount').value = rev.travel.traveler_count || '';
      document.getElementById('cnBudget').value = rev.constraints.budget_max_cny || '';
      document.getElementById('cnLayover').value = rev.constraints.max_layover_hours || '';
      document.getElementById('cnNight').value = rev.constraints.night_arrival || '';
      document.getElementById('cnTransfers').value = rev.constraints.max_transfers == null ? '' : rev.constraints.max_transfers;
      travelDirty = { type: false, out: false, ret: false, count: false };
      pendingRestore = { candidate_id: rev.candidate_id, candidate_key: rev.candidate_key, nights: rev.nights };
      requestPlan();
    }
    function openJourney(candidateId, nights, record, scroll) {
      if (planning) { MT.toast('正在更新路线，请稍等再查看详情'); return; }
      if (!activePlan || !activePlan.plan_id) { MT.toast('请先完成规划'); return; }
      var box = document.getElementById('journeyArea');
      if (!box) return;
      if (record) pendingRestore = null;
      /* 先记住点击意图，追加候选到达时也保留仍在加载的详情选择。 */
      var selectionMatches=!!MTRouteWorkspace.selectedCandidate(conversation && conversation.draft,activePlan.candidates,candidateId);
      if(selectionMatches){activeCandidate = candidateId; activeNights = nights;}
      var sequence = ++journeySequence, planId = activePlan.plan_id;
      box.innerHTML = '<div style="padding:18px;color:var(--mixtouring-muted-foreground);">正在核对行程结构…</div>';
      post('/api/anywhere/journey', { plan_id: activePlan.plan_id, candidate_id: candidateId, stopover_nights: nights }).then(function (res) {
        if (sequence !== journeySequence || !activePlan || planId !== activePlan.plan_id) return;
        if (res.code !== 0) { box.innerHTML = ''; MT.toast(res.msg || '详情暂不可用，请重新规划'); return; }
        if(MTRouteWorkspace.selectedCandidate(conversation && conversation.draft,activePlan.candidates,candidateId)){activeCandidate = candidateId; activeNights = nights;if(record)recordRevision(candidateId,nights);}
        renderJourney(res.data);
        rememberSession();
        if (scroll !== false) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }).catch(function () {
        if (sequence !== journeySequence || !activePlan || planId !== activePlan.plan_id) return;
        box.innerHTML = ''; MT.toast('详情服务不可用，请稍后重试');
      });
    }
    function journeyLegsHtml(legs, heading) {
      var html = '<h4 style="font-size:14px;margin:18px 0 8px;">' + heading + '</h4>';
      if (!legs.length) return html + '<p style="font-size:12.5px;color:#A16207;">该方向尚无可展示的逐段探索结构，请先核对日期与来源。</p>';
      return html + legs.map(function (leg) {
        return '<div style="padding:11px 13px;border-radius:12px;background:var(--mixtouring-muted);margin-top:7px;font-size:12.5px;line-height:1.7;">' +
          MT.esc(leg.from) + ' → ' + MT.esc(leg.to) + ' · ' + MT.esc(AW_MODE[leg.mode_guess] || '方式待查') + (leg.via ? '（途经' + MT.esc(leg.via) + '）' : '') +
          '</div>';
      }).join('');
    }
    function renderJourney(detail) {
      var box = document.getElementById('journeyArea');
      if (!box) return;
      var html = '<section class="detail-card" style="background:var(--mixtouring-card);border-radius:18px;padding:20px;box-shadow:var(--shadow-card-soft);">' +
        '<button id="btnBackCandidates" type="button" style="min-height:44px;padding:8px 0;border:0;background:none;color:var(--mixtouring-ring);font:inherit;font-size:12.5px;cursor:pointer;">‹ 返回走法候选</button>' +
        '<h3 style="font-size:17px;margin:0;">走法详情</h3>' +
        '<p style="font-size:12px;color:var(--mixtouring-muted-foreground);line-height:1.6;">当前展示路线结构；出行前请查询各段班次、价格与接驳。</p>';
      if (activePlan.intent.arrival_window) html += '<p style="font-size:12.5px;line-height:1.6;">希望到达：' + MT.esc(activePlan.intent.arrival_window) + '；各段班次尚未按此时间筛选。</p>';
      html += journeyLegsHtml(detail.outbound, detail.outbound_anchor?'前往目的地 · 后续交通日期待安排':'去程 · ' + (detail.outbound_window ? MT.esc(detail.outbound_window) : '日期待补'));
      if (detail.trip_type === 'round_trip') {
        html += journeyLegsHtml(detail.inbound, detail.return_anchor?'返回出发城 · 接驳日期待安排':'返程 · ' + (detail.return_window ? MT.esc(detail.return_window) : '日期待补'));
        if(detail.return_anchor) html+='<p>已定返程：'+MT.esc(detail.return_anchor.from_city)+' → '+MT.esc(detail.return_anchor.to_city)+' · '+MT.esc(detail.return_anchor.date)+'</p>';
        html += '<p style="font-size:11.5px;color:var(--mixtouring-muted-foreground);">'+MT.esc(detail.return_note)+'</p>';
      }
      if (detail.candidate_kind !== 'direct') {
        html += '<div style="margin-top:14px;font-size:12.5px;">路上多玩一座城市（可选）</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">' +
          [0, 1, 2].map(function (n) { return '<button type="button" class="btnStay" data-nights="' + n + '" style="min-height:44px;padding:8px 14px;border:1px solid var(--mixtouring-border);border-radius:10px;background:' + (n === activeNights ? 'var(--mixtouring-primary);color:#fff;' : '#fff;color:var(--mixtouring-foreground);') + 'font-family:inherit;cursor:pointer;">' + (n ? '停 ' + n + ' 晚' : '不安排停留') + '</button>'; }).join('') + '</div>';
      }
      if (detail.stopover) html += '<p style="font-size:12.5px;line-height:1.7;">在 ' + MT.esc(detail.stopover.city) + ' 停 ' + detail.stopover.nights + ' 晚。住宿与后续交通可在确定停留日期后查询。</p>';
      html += '<details style="margin-top:14px;padding:12px;background:var(--mixtouring-muted);border-radius:12px;font-size:12px;line-height:1.7;"><summary style="cursor:pointer;min-height:28px;">查看费用与逐段待查项</summary>';
      html+='<h4>已找到的交通资料</h4>'+ (detail.transport_references || []).map(function(row){return '<p>'+MT.esc(row.from)+' → '+MT.esc(row.to)+'</p>'+row.references.map(function(ref){var s=ref.schedule;return '<p><a href="'+MT.esc(ref.source.url)+'" target="_blank" rel="noopener noreferrer">'+MT.esc(ref.source.title)+'</a> · '+MT.esc({dated_partial:'时刻表参考',source_lead:'方向线索',historical:'历史资料',stale:'需重查',unsupported:'日期不适用'}[ref.evidence_state])+'</p>'+(s?'<p>'+MT.esc(s.service_no)+' · '+MT.esc(s.depart_time)+' → '+MT.esc(s.arrive_time)+(s.arrival_day_offset?'（到达次日）':'')+' · 两端当地时间<br>资料范围 '+MT.esc(s.start)+' 至 '+MT.esc(s.end)+'</p>':'')+'<p class="sight-muted">采样 '+MT.esc(ref.source.sampled_at)+' · 余票、费用和行李待查</p>';}).join('')+(row.references.length?'':'<p class="sight-muted">尚未找到本段交通资料。</p>');}).join('');
      html += '<div style="margin-top:8px;">费用待查：' + detail.cost.unknown_items.map(MT.esc).join('；') + '</div>';
      html += '<h4 style="font-size:14px;margin:18px 0 8px;">逐段待查项</h4>' + detail.checklist.map(function (row) {
        return '<div style="padding:9px 0;border-bottom:1px solid var(--mixtouring-border);font-size:12px;line-height:1.7;">' +
          (row.direction === 'outbound' ? '去程' : '返程') + ' · ' + MT.esc(row.segment) +
          '<div style="color:#A16207;">待核：' + row.missing.map(MT.esc).join('、') + '</div>' +
          '<div style="color:var(--mixtouring-muted-foreground);">' + MT.esc(row.manual_check) + '</div></div>';
      }).join('') + '</details>';
      html += '<div style="margin-top:16px;"><button id="btnEditForm" type="button" style="min-height:44px;padding:9px 16px;background:none;border:0;border-radius:10px;font:inherit;cursor:pointer;">编辑日期与已定交通</button></div>';
      html += '</section>';
      box.innerHTML = html;
      document.getElementById('btnBackCandidates').addEventListener('click', function () { resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
      box.querySelectorAll('.btnStay').forEach(function (btn) { btn.addEventListener('click', function () {
        var nights = Number(btn.getAttribute('data-nights'));
        applyGuide({ preferences: { nights: nights }, travel: {}, constraints: {} }, nights ? '改为停 ' + nights + ' 晚' : '取消中途停留');
      }); });
      document.getElementById('btnEditForm').addEventListener('click', function () { document.getElementById('entryCard').hidden=false;document.getElementById('entryExtras').hidden=false;document.getElementById('manualEntry').hidden=true;document.getElementById('moreConditions').open = true; document.getElementById('moreConditions').scrollIntoView({ behavior: 'smooth' }); });
    }

    document.getElementById('nlInput').addEventListener('input',updateComposer);
    document.getElementById('nlInput').addEventListener('keydown', function (event) {
      if(event.key==='Enter' && !event.shiftKey && !event.isComposing){event.preventDefault();composer.requestSubmit();}
    });
    /* 当前标签页恢复对话；私人草案仍由用户主动保存到独立存储。 */
    if (entryParams.get('inspiration') && !entryParams.get('restore')) {
      var inspirationSequence = planSequence;
      document.getElementById('planStatus').textContent = '正在载入这条路线灵感…';
      fetch('/api/inspirations').then(function (r) { return r.json(); }).then(function (res) {
        if (planSequence !== inspirationSequence) return;
        var item = (res.data || []).find(function (r) { return r.id === entryParams.get('inspiration'); });
        if (!item) throw new Error('灵感未找到');
        fillTravel({}); fillConstraints({});
        resetGuide(item.from + '去' + item.to);
        guideState = MTGuide.clean(item.preferences);
        guideMessages.push({ role: 'assistant', text: '已带入经' + item.stops.slice(1, -1).join('、') + '的路线结构。日期和具体班次会按你的新要求重新查询。' });
        document.getElementById('nlInput').value = item.from + '去' + item.to;
        document.getElementById('fromInput').value = item.from; document.getElementById('toInput').value = item.to;
        lastRequest = { origin: item.from, destination: item.to, inspiration_id: item.id, constraints: {} };
        startConversation('想以这条路线为起点：'+item.stops.join(' → ')+'。帮我一起想想适合怎样安排。');
      }).catch(function () { document.getElementById('planStatus').textContent = '暂时无法载入这条灵感，可以从一句话重新开始。'; });
    } else if (!entryParams.get('new') && !entryParams.get('restore') && !entryParams.get('from') && !entryParams.get('to')) {
      try {
        var session = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
        if (session && session.request && typeof session.request === 'object') restoreGuideSnapshot(session, true);
      } catch (e) { /* 旧会话损坏时正常显示空入口。 */ }
    }

  })();  </script>
</body>
</html>
