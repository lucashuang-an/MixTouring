    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap');
/* MixTouring HiFi — colors_and_type.css */
/* Brand prefix: mixtouring */
/* Design system: Warm Modern Minimalist (from travel-app-hifi) applied to MixTouring product */

:root {
  /* === Core Color Tokens === */
  --color-canvas: #F8F9FA;
  --color-surface: #FFFFFF;
  --color-primary-dark: #111111;
  --color-brand-accent: #C86A4B;
  --color-text-main: #1E2022;
  --color-text-muted: #7C8089;
  --color-badge-rating: #FBBF24;
  --color-accent-heart: #E11D48;
  --color-surface-2: #F4F5F7;
  --color-border-soft: #E8E9EB;

  /* === Semantic Aliases === */
  --mixtouring-background: #F8F9FA;
  --mixtouring-foreground: #1E2022;
  --mixtouring-card: #FFFFFF;
  --mixtouring-card-foreground: #1E2022;
  --mixtouring-popover: #FFFFFF;
  --mixtouring-popover-foreground: #1E2022;
  --mixtouring-primary: #111111;
  --mixtouring-primary-foreground: #FFFFFF;
  --mixtouring-muted: #F4F5F7;
  --mixtouring-muted-foreground: #7C8089;
  --mixtouring-border: #E8E9EB;
  --mixtouring-input: #FFFFFF;
  --mixtouring-ring: #C86A4B;

  /* === Radius Scale === */
  --mixtouring-radius-sm: 8px;
  --mixtouring-radius-md: 16px;
  --mixtouring-radius-lg: 24px;

  /* === Typography === */
  --mixtouring-font-sans: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;

  /* === Shadows === */
  --shadow-dock: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
  --shadow-card-soft: 0 4px 20px -2px rgba(0, 0, 0, 0.04);

  /* === Spacing (8pt grid) === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;

  /* === Radii === */
  --r-sheet: 32px;
  --r-card: 24px;
  --r-pill: 9999px;

  /* === State colors === */
  --state-warning: #FBBF24;
  --state-error: #E11D48;
  --state-success: #34c759;
}

    </style>

    --color-primary: var(--mixtouring-primary);

    --color-border: var(--mixtouring-border);

  <style id="critical-layout">
    * { font-weight: 400 !important; }
    b, strong { font-weight: 400 !important; }
    html, body { background: var(--mixtouring-background, #F8F9FA); }
    body { overflow-x: hidden; }
    .app-shell {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding: 0 0 112px 0;
      background: var(--mixtouring-background, #F8F9FA);
    }
    .detail-card {
      background: var(--mixtouring-card, #FFFFFF);
      border-radius: var(--mixtouring-radius-md, 16px);
      box-shadow: var(--shadow-card-soft, 0 4px 20px -2px rgba(0,0,0,0.04));
    }
    .row-card { cursor: pointer; transition: transform 0.15s ease; }
    .row-card:active { transform: scale(0.985); }
    .link-btn { transition: transform 0.15s ease; }
    .link-btn:active { transform: scale(0.97); }
    @media (max-width: 430px) {
      .app-shell { width: 100%; }
    }
  </style>

  <script>
  (function () {
    MT.wireNav();
    /* 版本号动态读取（P1：勿在页面写死） */
    var verEl = document.getElementById('verLine');
    if (verEl) verEl.textContent = '原型 ' + (window.MT && MT.VERSION ? MT.VERSION : '');

    /* ---------- 私人草案（卡 A）---------- */
    function renderDrafts() {
      var wrap = document.getElementById('draftWrap');
      if (!wrap || !window.MTDrafts) return;
      var res = MTDrafts.list();
      var html = '';
      if (res.corrupted_ids.length) {
        html += '<div class="detail-card p-4" style="border:1px solid #A16207;"><div style="font-size:13px;color:#A16207;">有 ' + res.corrupted_ids.length + ' 条本地草案数据损坏，已跳过显示（不影响其它草案）。</div>' +
          '<button type="button" id="btnPurgeCorrupted" style="min-height:40px;margin-top:8px;padding:7px 14px;border:1px solid #A16207;border-radius:9px;background:#fff;color:#A16207;font-family:inherit;font-size:12px;cursor:pointer;">清理损坏数据</button>' +
          '<div id="purgeNote" style="font-size:11.5px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:6px;">清理仅移除损坏条目，好草案不受影响；需确认后执行。</div></div>';
      }
      if (res.store_corrupted) {
        var raw = localStorage.getItem(MTDrafts.DRAFT_KEY);
        html += '<div class="detail-card p-4" style="border:1px solid #A8543A;"><div id="corruptStatus" style="font-size:13px;color:#A8543A;">本地草案存储数据损坏，为保护原数据已暂停读写。</div>' +
          '<div style="font-size:12px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:6px;line-height:1.7;">第一步：先复制/导出下方原文备份（清空前始终可见）。</div>' +
          '<textarea id="corruptBackup" readonly style="width:100%;height:90px;margin-top:6px;font-family:monospace;font-size:11px;box-sizing:border-box;"></textarea>' +
          '<button type="button" id="btnSelectBackup" style="min-height:40px;margin-top:6px;padding:7px 14px;border:1px solid var(--mixtouring-border,#E5E7EB);border-radius:9px;background:#fff;font-family:inherit;font-size:12px;cursor:pointer;">全选备份文本</button>' +
          '<div style="font-size:12px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:10px;line-height:1.7;">第二步：确认已备份后，清空草案存储（原数据将被移除）。</div>' +
          '<button type="button" id="btnResetStore" style="min-height:40px;margin-top:6px;padding:7px 14px;border:1px solid #A8543A;border-radius:9px;background:#fff;color:#A8543A;font-family:inherit;font-size:12px;cursor:pointer;">已备份，确认清空</button></div>';
        wrap.innerHTML = html;
        var backupEl = document.getElementById('corruptBackup');
        if (raw != null) backupEl.value = raw; /* 用 value 赋值，不经 innerHTML，防 </textarea> 破坏结构 */
        document.getElementById('btnSelectBackup').addEventListener('click', function () {
          backupEl.select();
          var copied = false;
          try { copied = document.execCommand('copy'); } catch (e) {}
          MT.toast(copied ? '备份已复制，请保存到本机' : '备份文本已选中，请手动复制保存');
        });
        document.getElementById('btnResetStore').addEventListener('click', function () {
          if (!confirm('确认已备份？清空后草案存储将被移除（备份文本仍在页面上）。')) return;
          var res2 = MTDrafts.resetAll();
          var note = document.createElement('div');
          note.style.cssText = 'font-size:12px;margin-top:8px;line-height:1.7;';
          if (res2.ok) {
            document.getElementById('corruptStatus').textContent = '本地草案存储已清空。';
            document.getElementById('btnResetStore').disabled = true;
            document.getElementById('btnResetStore').textContent = '已清空';
            note.textContent = '上方备份文本仍可复制，可据此人工恢复。刷新或离开本页前请保存副本。';
          }
          else note.textContent = '清空失败（' + res2.reason + '），请稍后重试。';
          wrap.appendChild(note);
        });
        return;
      }
      if (!res.drafts.length) {
        html += '<div class="detail-card p-4"><p style="font-size:12.5px;color:var(--mixtouring-muted-foreground,#7C8089);line-height:1.7;">还没有私人草案。在规划页走法详情里点「保存到我的行程」即可保存探索快照；恢复时会重新规划并重新确认开放地点，不把当时的走法当已核事实。草案仅保存在本浏览器，清理浏览器数据可能丢失。</p></div>';
        wrap.innerHTML = html;
        return;
      }
      res.drafts.forEach(function (d) {
        var latest = d.versions[d.versions.length - 1];
        var s = latest.snapshot;
        var summary = [s.candidate ? s.candidate.label : '待重新选择走法'];
        if (s.travel && s.travel.trip_type === 'round_trip') summary.push('往返');
        else if (s.travel && s.travel.trip_type === 'one_way') summary.push('单程');
        if (s.travel && s.travel.outbound_window) summary.push('去 ' + s.travel.outbound_window);
        if (s.travel && s.travel.return_window) summary.push('返 ' + s.travel.return_window);
        if (s.nights) summary.push('停 ' + s.nights + ' 晚');
        html += '<div class="detail-card p-4" data-draft="' + MT.esc(d.id) + '">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">' +
          '<div style="font-size:14px;font-weight:500;">' + MT.esc(d.name) + '</div>' +
          '<div style="font-size:11px;color:var(--mixtouring-muted-foreground,#7C8089);">更新于 ' + MT.esc(String(d.updated_at || '').slice(0, 10)) + '</div></div>' +
          '<div style="font-size:12px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:4px;line-height:1.7;">' + MT.esc(summary.join(' · ')) + ' · ' + d.versions.length + ' 个版本</div>' +
          (d.corrupted_version_count ? '<div style="font-size:11.5px;color:#A16207;margin-top:4px;">另有 ' + d.corrupted_version_count + ' 个版本损坏，原始记录已保留；其他版本仍可恢复。</div>' : '') +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
          '<button type="button" class="btnDraftOpen" data-id="' + MT.esc(d.id) + '" style="min-height:40px;padding:8px 14px;border:1px solid var(--mixtouring-ring,#C86A4B);border-radius:9px;background:#fff;color:var(--mixtouring-ring,#C86A4B);font-family:inherit;font-size:12.5px;cursor:pointer;">版本与恢复</button>' +
          '<button type="button" class="btnDraftRename" data-id="' + MT.esc(d.id) + '" style="min-height:40px;padding:8px 14px;border:1px solid var(--mixtouring-border,#E5E7EB);border-radius:9px;background:#fff;font-family:inherit;font-size:12.5px;cursor:pointer;">重命名</button>' +
          '<button type="button" class="btnDraftDel" data-id="' + MT.esc(d.id) + '" style="min-height:40px;padding:8px 14px;border:1px solid #E5B4B4;border-radius:9px;background:#fff;color:#A8543A;font-family:inherit;font-size:12.5px;cursor:pointer;">删除</button>' +
          '</div><div class="draftDetail" style="display:none;margin-top:12px;"></div></div>';
      });
      wrap.innerHTML = html;
      wrap.querySelectorAll('.btnDraftOpen').forEach(function (btn) {
        btn.addEventListener('click', function () { toggleDraftDetail(btn.getAttribute('data-id')); });
      });
      wrap.querySelectorAll('.btnDraftRename').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var d = MTDrafts.get(btn.getAttribute('data-id'));
          if (!d) return;
          var name = prompt('重命名草案', d.name);
          if (name == null) return;
          var res2 = MTDrafts.rename(d.id, name);
          if (res2.ok) { MT.toast('已重命名'); renderDrafts(); }
          else MT.toast('重命名失败（存储不可写）');
        });
      });
      wrap.querySelectorAll('.btnDraftDel').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var d = MTDrafts.get(id);
          if (!d) return;
          if (!confirm('删除草案「' + d.name + '」及其 ' + d.versions.length + ' 个版本？删除后不可恢复。')) return;
          var res2 = MTDrafts.remove(id);
          if (res2.ok) { MT.toast('已删除'); renderDrafts(); }
          else MT.toast('删除失败（存储不可写）');
        });
      });
    }
    function toggleDraftDetail(id) {
      var card = document.querySelector('[data-draft="' + id + '"]');
      if (!card) return;
      var box = card.querySelector('.draftDetail');
      if (!box) return;
      if (box.style.display !== 'none') { box.style.display = 'none'; return; }
      var d = MTDrafts.get(id);
      if (!d) { box.style.display = 'block'; box.innerHTML = '<div style="font-size:12px;color:#A8543A;">草案已不存在或损坏。</div>'; return; }
      var html = '';
      d.versions.slice().reverse().forEach(function (v) {
        var s = v.snapshot;
        var sum = [s.candidate ? s.candidate.label : '待重新选择走法'];
        if (s.travel && s.travel.trip_type === 'round_trip') sum.push('往返');
        if (s.travel && s.travel.outbound_window) sum.push('去 ' + s.travel.outbound_window);
        if (s.travel && s.travel.return_window) sum.push('返 ' + s.travel.return_window);
        if (s.nights) sum.push('停 ' + s.nights + ' 晚');
        html += '<div style="padding:10px 0;border-bottom:1px solid var(--mixtouring-border,#E5E7EB);">' +
          '<div style="font-size:12.5px;">版本 ' + v.version + ' · ' + MT.esc(String(v.saved_at).slice(0, 10)) + ' · ' + MT.esc(sum.join(' · ')) + '</div>' +
          (s.confirmed_note && (s.confirmed_note.origin || s.confirmed_note.destination)
            ? '<div style="font-size:11.5px;color:#A16207;margin-top:3px;">保存时含开放地点确认——恢复时须重新核验确认。</div>' : '') +
          '<button type="button" class="btnDraftRestore" data-id="' + MT.esc(d.id) + '" data-vid="' + MT.esc(v.vid) + '" style="min-height:40px;margin-top:6px;padding:7px 14px;border:1px solid var(--mixtouring-ring,#C86A4B);border-radius:9px;background:#fff;color:var(--mixtouring-ring,#C86A4B);font-family:inherit;font-size:12px;cursor:pointer;">恢复此版本（重新规划）</button>' +
          '</div>';
      });
      html += '<div style="font-size:11.5px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:8px;line-height:1.6;">恢复＝回填输入并按当前供给重新规划：开放地点会重新核验并要求确认；若原走法已无等价候选，会保留旧摘要供对照并提示重新选择。</div>';
      box.innerHTML = html;
      box.style.display = 'block';
      box.querySelectorAll('.btnDraftRestore').forEach(function (btn) {
        btn.addEventListener('click', function () { restoreDraft(btn.getAttribute('data-id'), btn.getAttribute('data-vid')); });
      });
    }
    function restoreDraft(id, vid) {
      var d = MTDrafts.get(id);
      if (!d) { MT.toast('草案已不存在或损坏'); return; }
      var v = d.versions.filter(function (x) { return x.vid === vid; })[0];
      if (!v) { MT.toast('版本不存在'); return; }
      var s = v.snapshot;
      /* 回填输入到规划页 URL：恢复＝重新规划（不直接调详情、不用旧 plan_id） */
      var params = new URLSearchParams();
      if (s.request && s.request.origin) params.set('from', s.request.origin);
      if (s.request && s.request.destination) params.set('to', s.request.destination);
      if (s.request && s.request.text) params.set('text', s.request.text);
      if (s.travel) {
        if (s.travel.trip_type) params.set('type', s.travel.trip_type);
        if (s.travel.outbound_window) params.set('out', s.travel.outbound_window);
        if (s.travel.return_window) { params.set('ret', s.travel.return_window); params.set('type', 'round_trip'); } /* 带返程窗必为往返 */
        if (s.travel.traveler_count) params.set('count', s.travel.traveler_count);
      }
      if (s.constraints) {
        if (s.constraints.budget_max_cny != null) params.set('budget', s.constraints.budget_max_cny);
        if (s.constraints.max_layover_hours != null) params.set('layover', s.constraints.max_layover_hours);
        if (s.constraints.night_arrival) params.set('night', s.constraints.night_arrival);
        if (s.constraints.max_transfers != null) params.set('transfers', s.constraints.max_transfers);
      }
      if (s.nights) params.set('nights', s.nights);
      params.set('restore', '1');
      params.set('draft', id);
      params.set('ver', vid);
      if (s.candidate && s.candidate.hub) params.set('hub', s.candidate.hub);
      if (s.candidate && s.candidate.modes) params.set('modes', s.candidate.modes);
      if (s.candidate) params.set('clabel', s.candidate.label || '');
      location.href = 'trip.html?' + params.toString();
    }
    renderDrafts();

    /* ---------- 收藏列表 ---------- */
    function favRowHtml(f) {
      return '<div class="detail-card row-card p-4 flex items-center justify-between" data-fav-id="' + MT.esc(f.id) + '" data-fav-type="' + MT.esc(f.type) + '" role="button" tabindex="0">' +
        '<div class="flex items-center min-w-0" style="gap:10px;">' +
          '<div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background:rgba(225,29,72,0.08);">' +
            '<svg style="width:16px;height:16px;color:var(--color-accent-heart,#E11D48);"><use href="#hero-heart-solid"></use></svg>' +
          '</div>' +
          '<div class="min-w-0">' +
            '<div style="font-size:15px;color:var(--mixtouring-foreground,#1E2022);">' + MT.esc(f.title) + '</div>' +
            '<div style="font-size:12px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:3px;">历史路线收藏 · 当前费用待核 · 收藏于 ' + MT.fmtTs(f.ts) + '</div>' +
          '</div>' +
        '</div>' +
        '<svg class="shrink-0" style="width:16px;height:16px;color:var(--mixtouring-muted-foreground,#7C8089);margin-left:8px;"><use href="#hero-chevron-right"></use></svg>' +
      '</div>';
    }

    function renderFavs() {
      var list = MT.favList();
      var wrap = document.getElementById('favWrap');
      if (!list.length) {
        wrap.innerHTML = '<div class="detail-card p-5 text-center" style="font-size:13px;color:var(--mixtouring-muted-foreground,#7C8089);line-height:1.7;">还没有收藏任何方案<br />在方案详情页点「收藏」，会出现在这里</div>';
        return;
      }
      wrap.innerHTML = list.map(favRowHtml).join('');
      wrap.querySelectorAll('.row-card').forEach(function (card) {
        function open() {
          var id = card.getAttribute('data-fav-id');
          var type = card.getAttribute('data-fav-type');
          location.href = type === 'tpl' ? ('detail.html?tpl=' + id + '&source=library') : ('detail.html?id=' + id + '&source=library');
        }
        card.addEventListener('click', open);
        card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      });
    }

    /* ---------- 回填记录 ---------- */
    function fbRowHtml(r) {
      return '<div class="detail-card p-4">' +
        '<div class="flex items-center justify-between">' +
          '<div class="flex items-center" style="gap:8px;">' +
            '<svg style="width:15px;height:15px;color:var(--mixtouring-ring,#C86A4B);"><use href="#hero-pencil-square"></use></svg>' +
            '<span style="font-size:15px;color:var(--mixtouring-foreground,#1E2022);">' + MT.esc(r.title) + '</span>' +
          '</div>' +
          '<span style="font-size:12px;color:var(--mixtouring-muted-foreground,#7C8089);">' + MT.fmtTs(r.ts) + '</span>' +
        '</div>' +
        '<div class="flex items-center flex-wrap" style="gap:6px;margin-top:10px;">' +
          (r.smooth ? '<span style="font-size:12px;padding:3px 10px;border-radius:9999px;background:' + (r.smooth === '顺利' ? 'rgba(52,199,89,0.10);color:#2e9e54;' : r.smooth === '误衔接' ? 'rgba(225,29,72,0.08);color:#be123c;' : 'rgba(251,191,36,0.14);color:#A16207;') + '">衔接 ' + MT.esc(r.smooth) + '</span>' : '') +
          (r.cost ? '<span style="font-size:12px;padding:3px 10px;border-radius:9999px;background:var(--mixtouring-muted,#F4F5F7);color:var(--mixtouring-ring,#C86A4B);">实际花费 ' + MT.esc(r.cost) + '</span>' : '') +
          (r.time ? '<span style="font-size:12px;padding:3px 10px;border-radius:9999px;background:var(--mixtouring-muted,#F4F5F7);color:var(--mixtouring-muted-foreground,#7C8089);">实际耗时 ' + MT.esc(r.time) + '</span>' : '') +
        '</div>' +
        (r.note ? '<p style="font-size:13px;color:var(--mixtouring-muted-foreground,#7C8089);line-height:1.6;margin-top:10px;">' + MT.esc(r.note) + '</p>' : '') +
      '</div>';
    }

    function renderFeedback() {
      var list = MT.feedbackList();
      var wrap = document.getElementById('fbWrap');
      if (!list.length) {
        wrap.innerHTML = '<div class="detail-card p-5 text-center" style="font-size:13px;color:var(--mixtouring-muted-foreground,#7C8089);line-height:1.7;">还没有回填过实测数据<br />走过某条方案后，在详情页点「回填实测」</div>';
        return;
      }
      wrap.innerHTML = list.map(fbRowHtml).join('');
    }

    /* ---------- 我的心愿 ---------- */
    function wishRowHtml(w) {
      var statusColor; var statusText;
      if (w.status === 'generated') { statusColor = '#34c759'; statusText = '已生成'; }
      else if (w.status === 'pending') {
        /* 服务端队列状态（Phase 3）：processing=离线管道生成中；仅文案增强，状态机不变 */
        statusColor = '#FBBF24';
        statusText = w.serverStatus === 'processing' ? '生成中' : '探索中';
      } else { statusColor = '#7C8089'; statusText = '已关闭'; }
      var generated = w.generatedAt ? ' · ' + MT.fmtTs(w.generatedAt) : '';
      return '<div class="detail-card row-card p-4 flex items-center justify-between" data-wish-id="' + MT.esc(w.id) + '" role="button" tabindex="0">' +
        '<div class="flex items-center min-w-0" style="gap:10px;">' +
          '<div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background:rgba(200,106,75,0.08);">' +
            '<svg style="width:16px;height:16px;color:var(--mixtouring-ring,#C86A4B);"><use href="#hero-sparkles"></use></svg>' +
          '</div>' +
          '<div class="min-w-0">' +
            '<div style="font-size:15px;color:var(--mixtouring-foreground,#1E2022);">' + MT.esc(w.from + ' → ' + w.to) + '</div>' +
            '<div style="font-size:12px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:3px;">' + MT.esc(w.date) + ' · <span style="color:' + statusColor + ';">' + statusText + '</span>' + generated + '</div>' +
          '</div>' +
        '</div>' +
        '<svg class="shrink-0" style="width:16px;height:16px;color:var(--mixtouring-muted-foreground,#7C8089);margin-left:8px;"><use href="#hero-chevron-right"></use></svg>' +
      '</div>';
    }

    function renderWishes() {
      /* 自动回流：方案库已有此路线（离线生成已完成）时，pending 升级为 generated */
      var pending = MT.wishList().filter(function (w) { return w.status === 'pending'; });
      pending.forEach(function (w) {
        if (window.DB && window.DB.routes[w.from + '-' + w.to]) MT.wishMarkGenerated(w.from, w.to);
      });
      var list = MT.wishList().filter(function (w) { return w.status !== 'dismissed'; });
      var wrap = document.getElementById('wishWrap');
      if (!list.length) {
        wrap.innerHTML = '<div class="detail-card p-5 text-center" style="font-size:13px;color:var(--mixtouring-muted-foreground,#7C8089);line-height:1.7;">还没有心愿路线<br />可以先到规划页探索新的出行方向</div>';
        return;
      }
      wrap.innerHTML = list.map(wishRowHtml).join('');
      bindWishCards(wrap);

      /* Phase 3：拉服务端队列状态合并显示（后端可达时 pending 可见「生成中」；失败静默保持本地状态） */
      API.fetchWishes().then(function (res) {
        if (!res || res.code !== 0 || !Array.isArray(res.data)) return;
        var map = {};
        res.data.forEach(function (s) { map[s.from + '-' + s.to] = s.status; });
        var changed = false;
        list.forEach(function (w) {
          if (w.status !== 'pending') return;
          var s = map[w.from + '-' + w.to];
          if (s && s !== 'generated' && s !== w.serverStatus) { w.serverStatus = s; changed = true; }
        });
        if (changed) {
          wrap.innerHTML = list.map(wishRowHtml).join('');
          bindWishCards(wrap);
        }
      });
    }

    function bindWishCards(wrap) {
      wrap.querySelectorAll('.row-card').forEach(function (card) {
        function open() {
          var id = card.getAttribute('data-wish-id');
          var w = MT.wishList().find(function (x) { return x.id === id; });
          if (!w) return;
          location.href = 'trip.html?' + new URLSearchParams({ from: w.from, to: w.to });
        }
        card.addEventListener('click', open);
        card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      });
    }

    renderFavs();
    renderWishes();
    renderFeedback();
  })();
  </script>
</body>
</html>
