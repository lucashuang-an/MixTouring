  <link rel="stylesheet" href="../assets/desktop.css" />
  <link rel="stylesheet" href="../assets/product-shell.css">
<link rel="stylesheet" href="../assets/personal.css">
<link rel="stylesheet" href="../assets/desktop-ui.css"></head>
<body class="trip-page product-page user-page" style="margin:0;padding:0;background:var(--mixtouring-background,#F8F9FA);font-family:var(--mixtouring-font-sans,'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif);color:var(--mixtouring-foreground,#1E2022);-webkit-font-smoothing:antialiased;"><a class="mt-skip" href="#mainContent">跳转到主要内容</a><nav data-mobile-nav="global" class="mt-sidebar personal-menu" aria-label="主要导航"><div class="mt-brand"><span>MixTouring</span><button type="button" id="sidebarToggle" aria-label="收起侧栏" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM9 4v16"/></svg></button></div><div class="mt-nav-links"><a href="trip.html?new=1" title="新建旅行"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="nav-label">新建旅行</span></a><a href="me.html" aria-current="page" title="我的旅行"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM8 6V3h8v3M8 10v6M16 10v6"/></svg><span class="nav-label">我的旅行</span></a><a href="collections.html" title="收藏"><img src="../assets/heart-gray.svg" alt=""><span class="nav-label">收藏</span></a><a href="community.html" title="社区"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0"/></svg><span class="nav-label">社区</span></a></div><div class="mt-account"><button type="button" id="accountToggle" aria-label="本机账号" aria-expanded="false" aria-controls="accountMenu"><span class="mt-avatar" aria-hidden="true">M</span><span class="nav-label">本机账号</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 14 4-4 4 4"/></svg></button><div id="accountMenu" hidden><a href="settings.html">设置</a><a href="help.html">帮助与反馈</a></div></div></nav>




  <main id="mainContent" tabindex="-1" class="app-shell">

    <!-- 页头 -->
    <header class="mt-page-heading"><h1>我的旅行</h1></header>

    <section id="sessionResume" class="mt-panel resume-panel" hidden></section>
    <div class="trips-toolbar"><input id="draftSearch" type="search" aria-label="查找旅行" placeholder="搜索名称或城市" autocomplete="off"><p id="draftCount" role="status"></p></div>
    <!-- 私人草案（卡 A：本机私密保存，恢复须重新规划并重新确认开放地点） -->

    <div class="px-4 pt-3 flex flex-col" style="gap: 10px;" id="draftWrap"></div>

  </main>

  <!-- Bottom Navigation -->

  <script src="../assets/app.js"></script>
  <script src="../assets/draft-store.js"></script>
  <script src="../assets/save-state.js"></script>
  <script src="../assets/my-trips.js"></script>
  <script>
  (function () {
    function savedDate(value) {
      var d = new Date(value), parts = {};
      if (!Number.isFinite(d.getTime())) return '时间未知';
      new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Shanghai', year:'numeric',month:'2-digit',day:'2-digit' }).formatToParts(d).forEach(function (p) { parts[p.type]=p.value; });
      return parts.year+'-'+parts.month+'-'+parts.day+'（北京时间）';
    }
    MT.wireNav();
    /* ---------- 私人草案（卡 A）---------- */
    function renderDrafts() {
      var wrap = document.getElementById('draftWrap');
      if (!wrap || !window.MTDrafts) return;
      var res = MTDrafts.list();
      var html = '';document.getElementById('draftCount').textContent=res.drafts.length+' 份旅行';
      if (res.corrupted_ids.length) {
        html += '<div class="detail-card p-4" style="border:1px solid #A16207;"><div style="font-size:13px;color:#A16207;">有 ' + res.corrupted_ids.length + ' 条本地草案数据损坏，已跳过显示（不影响其它草案）。</div>' +
          '<button type="button" id="btnPurgeCorrupted" style="min-height:40px;margin-top:8px;padding:7px 14px;border:1px solid #A16207;border-radius:9px;background:#fff;color:#A16207;font-family:inherit;font-size:12px;cursor:pointer;">清理损坏数据</button>' +
          '<div id="purgeNote" style="font-size:11.5px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:6px;">清理仅移除损坏条目，好草案不受影响；需确认后执行。</div></div>';
      }
      if (res.store_corrupted) {
        var raw=null;try{raw=(globalThis.MTLocalStorage || localStorage).getItem(MTDrafts.DRAFT_KEY);}catch(e){}
        if(res.reason==='read_failed'){wrap.innerHTML='<div class="mt-empty"><h2>暂时无法读取本机行程</h2><p>请检查浏览器的存储权限后重试，原数据未清理。</p><button type="button" id="retryDraftRead" class="mt-button-secondary">重新读取</button></div>';document.getElementById('retryDraftRead').onclick=renderDrafts;return;}
        html += '<div class="detail-card p-4" style="border:1px solid #A8543A;"><div id="corruptStatus" style="font-size:13px;color:#A8543A;">本地草案存储数据损坏，为保护原数据已暂停读写。</div>' +
          '<div style="font-size:12px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:6px;line-height:1.7;">第一步：先复制/导出下方原文备份（清空前始终可见）。</div>' +
          '<textarea id="corruptBackup" readonly style="width:100%;height:90px;margin-top:6px;font-family:monospace;font-size:11px;box-sizing:border-box;"></textarea>' +
          '<button type="button" id="btnSelectBackup" style="min-height:40px;margin-top:6px;padding:7px 14px;border:1px solid var(--mixtouring-border,#E5E7EB);border-radius:9px;background:#fff;font-family:inherit;font-size:12px;cursor:pointer;">全选备份文本</button>' +
          '<div style="font-size:12px;color:var(--mixtouring-muted-foreground,#7C8089);margin-top:10px;line-height:1.7;">第二步：确认已备份后，清空草案存储（原数据将被移除）。</div>' +
          '<button type="button" id="btnResetStore" style="min-height:40px;margin-top:6px;padding:7px 14px;border:1px solid #A8543A;border-radius:9px;background:#fff;color:#A8543A;font-family:inherit;font-size:12px;cursor:pointer;">已备份，确认清空</button></div>';
        wrap.innerHTML = html;
        var backupEl = document.getElementById('corruptBackup');
        if (raw != null) backupEl.value = raw; /* 用 value 赋值，不经 innerHTML，防 </textarea> 破坏结构 */
        document.getElementById('btnSelectBackup').addEventListener('click', function () {
          backupEl.select();
          var copied = false;
          try { copied = document.execCommand('copy'); } catch (e) {}
          MT.toast(copied ? '备份已复制，请保存到本机' : '备份文本已选中，请手动复制保存');
        });
        document.getElementById('btnResetStore').addEventListener('click', function () {
          if (!confirm('确认已备份？清空后草案存储将被移除（备份文本仍在页面上）。')) return;
          var res2 = MTDrafts.resetAll();
          var note = document.createElement('div');
          note.style.cssText = 'font-size:12px;margin-top:8px;line-height:1.7;';
          if (res2.ok) {
            document.getElementById('corruptStatus').textContent = '本地草案存储已清空。';
            document.getElementById('btnResetStore').disabled = true;
            document.getElementById('btnResetStore').textContent = '已清空';
            note.textContent = '上方备份文本仍可复制，可据此人工恢复。刷新或离开本页前请保存副本。';
          }
          else note.textContent = '清空失败（' + res2.reason + '），请稍后重试。';
          wrap.appendChild(note);
        });
        return;
      }
      if (!res.drafts.length) {
        html += '<div class="mt-empty"><h2>下一趟旅行，从一个想法开始。</h2><p>之后可从这里继续任何一次讨论。</p><a class="mt-button-primary" href="trip.html?new=1">开始规划 →</a></div>';
        wrap.innerHTML = html;
        return;
      }
      var query=document.getElementById('draftSearch').value,visible=MTTrips.filter(res.drafts,query);
      document.getElementById('draftCount').textContent=visible.length+' 份旅行'+(query?' · 已按搜索筛选':'');
      if(!visible.length)html+='<div class="mt-empty"><h2>没有找到匹配的旅行</h2><p>试试其他城市或名称。</p><button type="button" class="mt-button-secondary" id="clearDraftSearch">清除搜索</button></div>';
      visible.forEach(function(d){var latest=d.versions.at(-1),info=MTTrips.summary(latest.snapshot),id=MT.esc(d.id);
        html+='<article class="trip-library-card" data-draft="'+id+'"><div class="trip-library-heading"><h2 data-no-i18n>'+MT.esc(d.name)+'</h2></div><p class="mt-meta">'+(latest.snapshot.conversation?.draft?(['partial','unreviewed'].includes(latest.snapshot.conversation.draft.quality_status)?'行程待完善':'已有行程'):'仍在讨论')+'</p>'+(d.corrupted_version_count?'<p class="mt-notice">部分版本损坏，原记录保留；仍可继续其他版本。</p>':'')+
          '<div class="trip-library-actions"><button type="button" class="btnDraftContinue mt-button-primary" data-id="'+id+'">继续规划</button><button type="button" class="btnDraftRename mt-button-secondary" data-id="'+id+'">重命名</button><details class="trip-more"><summary>更多</summary><div><button type="button" class="btnDraftOpen mt-text-button" data-id="'+id+'" aria-expanded="false">历史版本</button><button type="button" class="btnDraftDel mt-text-button" data-id="'+id+'">删除</button></div></details></div>'+
          '<form class="draftRename" hidden><label>旅行名称<input name="tripName" maxlength="40" required value="'+MT.esc(d.name)+'"></label><p class="mt-form-error" role="status"></p><div class="mt-actions"><button class="mt-button-primary" type="submit">保存名称</button><button class="mt-button-secondary cancelRename" type="button">取消</button></div></form>'+
          '<div class="draftDelete mt-notice" role="group" aria-label="删除确认" hidden><p>将删除这份旅行及其 '+d.versions.length+' 个版本，此操作无法撤销。</p><div class="mt-actions"><button class="mt-button-danger confirmDelete" type="button">确认删除这份旅行</button><button class="mt-button-secondary cancelDelete" type="button">保留旅行</button></div><p class="mt-form-error" role="status"></p></div><div class="draftDetail" hidden></div></article>';
      });wrap.innerHTML=html;
      var clear=document.getElementById('clearDraftSearch');if(clear)clear.onclick=function(){document.getElementById('draftSearch').value='';renderDrafts();};
      wrap.querySelectorAll('[data-draft]').forEach(function(card){var id=card.dataset.draft,rename=card.querySelector('.draftRename'),deletion=card.querySelector('.draftDelete');
        card.querySelector('.btnDraftContinue').onclick=function(){var d=MTDrafts.get(id);if(d?.versions.length)restoreDraft(id,d.versions.at(-1).vid);else MT.toast('行程暂不可读取，请刷新列表');};
        card.querySelector('.btnDraftOpen').onclick=function(){card.querySelector('.trip-more').open=false;toggleDraftDetail(id);};
        card.querySelector('.btnDraftRename').onclick=function(){card.querySelector('.trip-more').open=false;rename.hidden=!rename.hidden;deletion.hidden=true;if(!rename.hidden)rename.querySelector('input').focus();};
        function closeRename(){rename.hidden=true;card.querySelector('.btnDraftRename').focus();}
        card.querySelector('.cancelRename').onclick=closeRename;rename.onkeydown=function(e){if(e.key==='Escape'){e.preventDefault();closeRename();}};
        rename.onsubmit=function(e){e.preventDefault();var name=rename.querySelector('input').value.trim();if(!name){rename.querySelector('[role=status]').textContent='请输入旅行名称';return;}var r=MTDrafts.rename(id,name);if(r.ok){MT.toast('旅行名称已更新');renderDrafts();}else rename.querySelector('[role=status]').textContent='名称未保存，请稍后重试。';};
        card.querySelector('.btnDraftDel').onclick=function(){card.querySelector('.trip-more').open=false;deletion.hidden=false;rename.hidden=true;deletion.querySelector('.cancelDelete').focus();};
        function closeDelete(){deletion.hidden=true;card.querySelector('.trip-more summary').focus();}card.querySelector('.cancelDelete').onclick=closeDelete;deletion.onkeydown=function(e){if(e.key==='Escape'){e.preventDefault();closeDelete();}};
        card.querySelector('.confirmDelete').onclick=function(){var r=MTDrafts.remove(id);if(r.ok){MT.toast('旅行已删除');renderDrafts();}else deletion.querySelector('[role=status]').textContent='未删除成功，请稍后重试。';};
      });

    }
    function toggleDraftDetail(id){var card=Array.from(document.querySelectorAll('[data-draft]')).find(function(c){return c.dataset.draft===id;});if(!card)return;var box=card.querySelector('.draftDetail'),button=card.querySelector('.btnDraftOpen');if(!box.hidden){box.hidden=true;button.setAttribute('aria-expanded','false');card.querySelector('.trip-more summary').focus();return;}var d=MTDrafts.get(id);if(!d){MT.toast('行程暂不可读取');return;}
      box.innerHTML='<h3>历史版本</h3>'+d.versions.slice().reverse().map(function(v,i){var info=MTTrips.summary(v.snapshot),index=d.versions.indexOf(v),diff=MTTrips.changes(d.versions[index-1]?.snapshot,v.snapshot);return '<section class="trip-version"><div class="trip-version-heading"><span>版本 '+v.version+(i===0?' · 最新保存':'')+'</span><span class="mt-meta">'+MT.esc(savedDate(v.saved_at))+'</span></div><p>'+MT.esc(diff.join(' · '))+'</p><details><summary>查看这版安排</summary><p>'+MT.esc(info.title)+'</p><p data-no-i18n>'+MT.esc(info.route)+'</p><p class="mt-meta">'+MT.esc(info.conditions.join(' · '))+' · '+info.cards+' 张安排卡</p></details><button class="btnDraftRestore mt-button-secondary" type="button" data-vid="'+MT.esc(v.vid)+'">从此版本继续</button></section>';}).join('')+'<p class="mt-meta">继续时保留此版安排；交通与开放资料仍需按出行时间重新核对。</p>';
      box.hidden=false;box.tabIndex=-1;box.focus();button.setAttribute('aria-expanded','true');box.querySelectorAll('.btnDraftRestore').forEach(function(b){b.onclick=function(){restoreDraft(id,b.dataset.vid);};});
    }
    function restoreDraft(id, vid) {
      var d = MTDrafts.get(id);
      if (!d) { MT.toast('草案已不存在或损坏'); return; }
      var v = d.versions.filter(function (x) { return x.vid === vid; })[0];
      if (!v) { MT.toast('版本不存在'); return; }
      var s = v.snapshot;
      /* 回填输入到规划页 URL：恢复＝重新规划（不直接调详情、不用旧 plan_id） */
      var params = new URLSearchParams();
      if (s.request && s.request.origin) params.set('from', s.request.origin);
      if (s.request && s.request.destination) params.set('to', s.request.destination);
      if (s.request && s.request.text) params.set('text', s.request.text);
      if (s.travel) {
        if (s.travel.trip_type) params.set('type', s.travel.trip_type);
        if (s.travel.outbound_window) params.set('out', s.travel.outbound_window);
        if (s.travel.return_window) { params.set('ret', s.travel.return_window); params.set('type', 'round_trip'); } /* 带返程窗必为往返 */
        if (s.travel.traveler_count) params.set('count', s.travel.traveler_count);
      }
      if (s.constraints) {
        if (s.constraints.budget_max_cny != null) params.set('budget', s.constraints.budget_max_cny);
        if (s.constraints.max_layover_hours != null) params.set('layover', s.constraints.max_layover_hours);
        if (s.constraints.night_arrival) params.set('night', s.constraints.night_arrival);
        if (s.constraints.max_transfers != null) params.set('transfers', s.constraints.max_transfers);
      }
      if (s.nights) params.set('nights', s.nights);
      params.set('restore', '1');
      params.set('draft', id);
      params.set('ver', vid);
      if (s.candidate && s.candidate.hub) params.set('hub', s.candidate.hub);
      if (s.candidate && s.candidate.modes) params.set('modes', s.candidate.modes);
      if (s.candidate) params.set('clabel', s.candidate.label || '');
      location.href = 'trip.html?' + params.toString();
    }
    renderDrafts();
    document.getElementById('draftSearch').addEventListener('input',renderDrafts);
    document.getElementById('draftWrap').addEventListener('click',function(e){if(!e.target.closest('#btnPurgeCorrupted'))return;if(!confirm('只清理无法识别的损坏条目？正常旅行和版本会保留。'))return;var result=MTDrafts.purgeCorrupted();if(result.ok)renderDrafts();else MT.toast('未能清理，原记录保留');});
    var resume=document.getElementById('sessionResume');try{var session=JSON.parse((globalThis.MTSessionStorage || sessionStorage).getItem('mt:planning-session') || 'null');if(session?.conversation && !MTSaveState.find(session,MTDrafts.list(),session.saved_draft_id).saved){var info=MTTrips.summary(session);resume.hidden=false;resume.innerHTML='<div><p class="mt-eyebrow">上次尚未保存</p><h2>'+MT.esc(info.route || '还在讨论的旅行想法')+'</h2><p class="mt-meta">继续上次对话，保存后会出现在下方列表。</p></div><a class="mt-button-secondary" href="trip.html">继续这次规划</a>';}}catch(e){}
    window.addEventListener('storage',function(e){if(e.key===MTDrafts.DRAFT_KEY)MT.toast('其他窗口已更新旅行，请刷新后继续管理');});

  })();
  </script>
<script src="../assets/personal-store.js"></script><script src="../assets/personal-ui.js"></script>
