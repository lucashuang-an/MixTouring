    <rect x="64" y="123" width="54" height="4" rx="2" fill="#B35E45"/>
    <text x="60" y="202" fill="#202220" font-size="49" font-weight="700">一个人，也能</text>
    <text x="60" y="266" fill="#202220" font-size="49" font-weight="700">走得更远。</text>
    <text x="64" y="321" fill="#565E58" font-size="19">探索走法，比较取舍。</text>
    <text x="64" y="352" fill="#565E58" font-size="19">把想去的地方慢慢变成计划。</text>
    <text x="64" y="411" fill="#687166" font-size="12" letter-spacing="2">线路发现 / 旅行规划 / 私人草案</text>
  </g>
