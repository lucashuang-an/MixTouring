<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">MixTouring · 一个人，也能走得更远。</title>
  <desc id="desc">米白底色、赤陶色路线与山峦。探索走法，比较取舍，把想去的地方慢慢变成计划。路线为装饰示意，不代表实际交通连接。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DFE1DA"/></pattern>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E7EDE2"/><stop offset="1" stop-color="#F1EEE4"/></linearGradient>
  </defs>
  <rect width="1280" height="460" rx="24" fill="#F8F7F2"/>
  <rect x="688" y="24" width="568" height="412" rx="20" fill="url(#grid)"/>
