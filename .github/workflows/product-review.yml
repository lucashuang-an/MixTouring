# 产品评审事件链路（E1 卡）：PR 交付 → CI 门禁 → 只读产品评审 → 状态/评论回流
# 纪律（开发流程 §4.1）：以 PR head SHA 为唯一对象；必需 CI 未完成则退出，任一失败写「CI 阻断」
# 且不启动产品评审；同 SHA 幂等（不重复评审）；评审器只读，不改代码/数据/提交/推送/合并。
name: product-review
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    # 同仓库 PR 事件直接跑；workflow_run 只处理 verify 成功/失败完成且 head 在同仓库（fork 不暴露密钥）
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解析 PR 与 head SHA（workflow_run 场景按 head SHA 反查 PR）
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WR_HEAD: ${{ github.event.workflow_run.head_sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/e1-context.mjs

      - name: CI 门禁（未完成退出 / 失败阻断）
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/e1-gate.mjs

      - name: 只读产品评审（OpenAI；key 缺失时输出占位说明，不伪造通过）
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        run: node scripts/e1-review.mjs

      - name: 发布评审（Issue #3 唯一交接评论 + PR 摘要 + product-review 状态；同 SHA 幂等）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: node scripts/e1-publish.mjs
