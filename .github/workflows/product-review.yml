# 产品评审事件链路（E1 卡 · v0.28.1 依评审重构为订阅制/无模型版）：
# PR 交付 → CI 门禁 → 「CI ready / CI blocked」无模型评论与 product-review 状态。
# 不调用任何 LLM API、不读取任何密钥（按评审 P0 已彻底移除 API 密钥方案）；
# 产品评审本身由仓库负责人在 ChatGPT Work 的 GitHub PR 事件任务执行（订阅制）。
name: product-review
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解析 PR 与 head SHA（workflow_run 场景按 head SHA 反查 PR）
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WR_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/e1-context.mjs

      - name: CI 门禁（输出 ready/blocked 结论与评论文本）
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/e1-gate.mjs

      - name: 发布 CI ready/blocked 评论与 product-review 状态（评审由 ChatGPT Work 事件任务执行）
        if: steps.ctx.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          CI_STATE: ${{ steps.gate.outputs.ci_state }}
          CI_COMMENT: ${{ steps.gate.outputs.ci_comment }}
        run: node scripts/e1-notify.mjs
