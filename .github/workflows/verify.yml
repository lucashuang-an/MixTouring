# CI · 旅行Agent：无预置库、无密钥失败边界、证据与用户状态，以及当前网页静态检查。
name: verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MT_LLM_USAGE_LOG: /tmp/mixtouring-test-usage.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # start 脚本用 --env-file-if-exists（Node ≥22.9），CI 与运行要求对齐
      - name: 安装后端依赖
        working-directory: server
        run: npm ci
      - name: 启动后端并跑全接口验证（verify.mjs）
        working-directory: server
        run: |
          node index.mjs &
          sleep 3
          node verify.mjs
      - name: 当前网页静态自检（check-pages.mjs）
        run: node pipeline/check-pages.mjs
      - name: 行程契约确定性测试（check-trip.mjs，G1 底座回归）
        run: node server/check-trip.mjs
      - name: G4 私人草案存储层测试（check-drafts.mjs）
        run: node server/check-drafts.mjs
      - name: 对话引导与探索详情回归
        run: |
          node server/check-agent-prompts.mjs
          node server/check-planning-discussion.mjs
          node server/check-planning-contract.mjs
          node server/check-planning-flow.mjs
          node server/check-transport-options.mjs
          node server/check-transport-map.mjs
          node server/check-transport-revision.mjs
          node server/check-return-scope.mjs
          node server/check-conversation-progress.mjs
          node server/check-compose-provider.mjs
          node server/check-model-cache.mjs
          node server/check-p1-boundaries.mjs
          node server/check-p2-reuse.mjs
          node server/check-deepseek-search.mjs
          node server/check-agent-delivery.mjs
          node server/check-conversation.mjs
          node server/check-intent-actions.mjs
          node server/check-harness-generalization.mjs
          node server/check-agent-runtime.mjs
          node server/check-planning-loop.mjs
          node server/check-planning-session.mjs
          node server/check-foundations.mjs
          node server/check-itinerary-quality.mjs
          node server/check-quality-batches.mjs
          node server/check-evidence-patch-contract.mjs
          node server/check-evidence-spans.mjs
          node server/check-numeric-grounding.mjs
          node server/check-send-retry.mjs
          node server/check-context.mjs
          node server/check-trip-memory.mjs
          node server/check-preference-memory.mjs
          node server/check-chat-refresh.mjs
          node server/check-route-workspace.mjs
          node server/check-route-comparison.mjs
          node server/check-discovery-flow.mjs
          node server/check-route-research.mjs
          node server/check-draft-research.mjs
          node server/check-research-tasks.mjs
          node server/check-save-state.mjs
          node server/check-my-trips.mjs
          node server/check-travel-sources.mjs
          node server/check-source-time.mjs
          node server/check-source-baseline.mjs
          node server/check-search-adapters.mjs
          node server/check-source-content.mjs
          node server/check-harness-optimization.mjs
          node server/check-day-map.mjs
          node server/check-google-maps.mjs
          node server/check-google-routes.mjs
          node server/check-local-mobility.mjs
          node server/check-source-tasks.mjs
          node server/check-evidence-grounding.mjs
          node server/check-conversation-evidence.mjs
          node server/check-research-loop.mjs
          node server/check-journey.mjs
          node server/check-search-planner.mjs
          node server/check-trip-intent.mjs
          node server/check-no-preloads.mjs
