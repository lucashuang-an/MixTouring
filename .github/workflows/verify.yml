# CI · 每次推送自动验证（部署守门）：起真后端跑全接口断言 + 七页静态自检
# 无 LLM key 环境，LLM 路径按「未配置降级」断言；规则版闭环与全部数据契约在此把关
name: verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # start 脚本用 --env-file-if-exists（Node ≥22.9），CI 与运行要求对齐
      - name: 安装后端依赖
        working-directory: server
        run: npm ci
      - name: 启动后端并跑全接口验证（verify.mjs）
        working-directory: server
        run: |
          node index.mjs &
          sleep 3
          node verify.mjs
      - name: 七页静态自检（check-pages.mjs）
        run: node pipeline/check-pages.mjs
      - name: 地理技能自测（check-geo.mjs）
        run: node pipeline/check-geo.mjs
      - name: 行程契约确定性测试（check-trip.mjs，G1 底座回归）
        run: node server/check-trip.mjs
      - name: G2.5 任意地点规划确定性测试（check-anywhere.mjs）
        run: node server/check-anywhere.mjs
      - name: G2.6 线路发现质量校准（calibrate-routes.mjs）
        run: node server/calibrate-routes.mjs
      - name: G4 私人草案存储层测试（check-drafts.mjs）
        run: node server/check-drafts.mjs
      - name: 对话引导与探索详情回归
        run: |
          node server/check-guide.mjs
          node server/check-conversation.mjs
          node server/check-send-retry.mjs
          node server/check-context.mjs
          node server/check-trip-memory.mjs
          node server/check-chat-refresh.mjs
          node server/check-route-workspace.mjs
          node server/check-route-comparison.mjs
          node server/check-discovery-flow.mjs
          node server/check-route-research.mjs
          node server/check-draft-research.mjs
          node server/check-research-tasks.mjs
          node server/check-save-state.mjs
          node server/check-my-trips.mjs
          node server/check-travel-sources.mjs
          node server/check-source-time.mjs
          node server/check-journey.mjs
          node server/check-progressive.mjs
          node server/check-inspirations.mjs
          node server/check-sights.mjs
