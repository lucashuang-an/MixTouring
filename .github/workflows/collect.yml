# CI · 每日定时采集：心愿队列 pending 心愿自动联网采样 → 守门写回 → 自动提交
# 前提：仓库 Secrets 配置 LLM_API_KEY（LLM_BASE_URL/LLM_MODEL 可选），且仓库 Variables 设 LLM_COLLECT=1 显式开启；
# 未配置时本工作流静默跳过，不产生任何消耗。
name: collect
on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    if: ${{ vars.LLM_COLLECT == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 采集执行器（最多 2 条/日，控制检索消耗）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: node pipeline/collect-wish.mjs --all --limit 2
      - name: 有产物才提交（守门不过时 plans.json 无变化，自然跳过）
        run: |
          git config user.name "mixtouring-collector"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/data/ mixtouring-hifi/assets/mock.js pipeline/out/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "采集执行器：自动生成新心愿路线（CI 定时任务）" && git push)
